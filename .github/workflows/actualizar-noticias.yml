
name: Preparar noticias Colombia al Día (Bogotá)

on:
  workflow_dispatch:
  # Ejecutar autoprueba al cambiar código, nunca al crear medios de salida.
  push:
    branches: [main]
    paths:
      - 'noticias.json'
      - 'scripts/*.py'
      - 'tests/test_*.py'
      - 'index.html'
      - '.github/workflows/actualizar-noticias.yml'
  schedule:
    # GitHub Actions usa UTC; Bogotá (UTC-5) no cambia por horario de verano.
    # Preparación anticipada a las 07:10, 11:10 y 17:10 locales para permitir publicación a 08:00, 12:00 y 18:00.
    # El inicio puede demorarse; NO garantiza publicación exacta.
    - cron: '10 12,16,22 * * *'

permissions:
  contents: write

concurrency:
  group: noticias-auto
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Incorporar titulares
        run: python scripts/sync_sources.py --data noticias.json

      - name: Preparar narración propia ampliada en español
        run: python scripts/prepare_audio.py noticias.json

      - name: Instalar codificador MP3 requerido por la voz
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Preparar la única voz de la web
        run: |
          python -m pip install kokoro-onnx==0.6.1 soundfile
          curl --fail --location --retry 3 https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx -o /tmp/kokoro-v1.0.onnx
          curl --fail --location --retry 3 https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin -o /tmp/voices-v1.0.bin
          echo '7d5df8ecf7d4b1878015a32686053fd0eebe2bc377234608764cc0ef3636a6c5  /tmp/kokoro-v1.0.onnx' | sha256sum --check
          echo 'bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d  /tmp/voices-v1.0.bin' | sha256sum --check
          python scripts/generate_web_voice.py

      - name: Validar integridad y clasificación
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          python scripts/validate_news.py noticias.json

      - name: Actualizar portada HTML accesible
        run: python scripts/prepare_site.py

      - name: Verificar sintaxis del frontend y botón de escucha
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          raw=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\\s+[^>]*)?>(.*?)</script>',raw,re.S)
          assert scripts and 'const player=new Audio()' in scripts[-1], 'Reproductor de audio ausente'
          Path('/tmp/orbiuno-frontend.js').write_text(scripts[-1], encoding='utf-8')
          PY
          node --check /tmp/orbiuno-frontend.js

      - name: Instalar Pillow para carrusel editorial
        run: python -m pip install Pillow

      - name: Generar carrusel únicamente con noticias verificadas de hoy
        run: |
          python - <<'PY'
          import json
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from pathlib import Path
          data=json.loads(Path('noticias.json').read_text(encoding='utf-8'))
          today=datetime.now(ZoneInfo('America/Bogota')).date().isoformat()
          verified=[n for n in data.get('news',[]) if n.get('date')==today and n.get('verification')=='editorial_verified']
          if data.get('editionDate')!=today or not (1 <= len(verified) <= 4):
              print(f'NO PUBLICAR: edición {data.get("editionDate")}; {len(verified)} noticias verificadas de {today}')
              Path('/tmp/orbiuno_skip_carousel').touch()
          PY
          if [ ! -f /tmp/orbiuno_skip_carousel ]; then
            python scripts/build_carousel.py
          fi

      - name: Crear RSS con fuentes y enlaces originales
        run: python scripts/build_feed.py

      - name: Guardar actualizaciones sobre la última main sin perder cambios
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # No hacer rebase de archivos editoriales generados: puede colisionar
          # con otros commits de la web. Recalcular SIEMPRE sobre main actual.
          for i in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/sync_sources.py --data noticias.json
            python scripts/prepare_audio.py noticias.json
            python scripts/generate_web_voice.py
            python scripts/validate_news.py noticias.json
            python scripts/prepare_site.py
            python scripts/build_feed.py
            if [ ! -f /tmp/orbiuno_skip_carousel ]; then
              python scripts/build_carousel.py
            fi
            git add noticias.json index.html feed.xml media/web-voice
            if [ -d "media/$(TZ=America/Bogota date +%F)" ]; then
              git add "media/$(TZ=America/Bogota date +%F)"
            fi
            if git diff --cached --quiet; then
              echo 'Sin cambios nuevos'; exit 0
            fi
            git commit -m "Sincronizar fuentes y portada ORBIUNO"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((i * 3))
          done
          echo 'No se pudo guardar sin conflicto; no forzar escritura' >&2
          exit 1
