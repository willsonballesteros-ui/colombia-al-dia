
name: Preparar noticias ORBIUNO (Bogota)

on:
  workflow_dispatch:
  # Ejecutar autoprueba al cambiar código, nunca al crear medios de salida.
  push:
    branches: [main]
    paths:
      - 'scripts/*.py'
      - 'tests/test_*.py'
      - '.github/workflows/actualizar-noticias.yml'
  schedule:
    # GitHub Actions usa UTC; Bogotá (UTC-5) no cambia por horario de verano.
    # Preparación a las 07:30, 11:30 y 17:30 locales.
    # El inicio puede demorarse; NO garantiza publicación exacta.
    - cron: '30 12,16,22 * * *'

permissions:
  contents: write

concurrency:
  group: noticias-auto
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Incorporar titulares
        run: python scripts/sync_sources.py --data noticias.json

      - name: Validar integridad y clasificación
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          python scripts/validate_news.py noticias.json

      - name: Actualizar portada HTML accesible
        run: python scripts/prepare_site.py

      - name: Crear RSS con fuentes y enlaces originales
        run: python scripts/build_feed.py

      - name: Guardar actualizaciones sobre la última main sin perder cambios
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # No hacer rebase de archivos editoriales generados: puede colisionar
          # con otros commits de la web. Recalcular SIEMPRE sobre main actual.
          for i in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/sync_sources.py --data noticias.json
            python scripts/validate_news.py noticias.json
            python scripts/prepare_site.py
            python scripts/build_feed.py
            git add noticias.json index.html feed.xml
            if git diff --cached --quiet; then
              echo 'Sin cambios nuevos'; exit 0
            fi
            git commit -m "Sincronizar fuentes y portada ORBIUNO"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((i * 3))
          done
          echo 'No se pudo guardar sin conflicto; no forzar escritura' >&2
          exit 1
