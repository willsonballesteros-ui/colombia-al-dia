name: ORBIUNO - Edicion 18h con ef_dora y ORBIUNO PULSE
on:
  push:
    branches: [main]
    paths:
      - 'scripts/render_orbiuno_18h.py'
      - 'scripts/make_orbiuno_pulse.py'
      - '.github/workflows/reel-18h.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: orbiuno-reel-18h-20261106
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar FFmpeg y dependencias libres
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install --disable-pip-version-check "kokoro-onnx==0.6.1" Pillow numpy scipy soundfile
      - name: Descargar el sintetizador de voz aprobado
        run: |
          curl -fL --retry 3 https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx -o /tmp/kokoro-v1.0.onnx
          curl -fL --retry 3 https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin -o /tmp/voices-v1.0.bin
          echo '7d5df8ecf7d4b1878015a32686053fd0eebe2bc377234608764cc0ef3636a6c5  /tmp/kokoro-v1.0.onnx' | sha256sum --check
          echo 'bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d  /tmp/voices-v1.0.bin' | sha256sum --check
      - name: Comprobar la web de la edicion y sus reportajes antes del video
        run: |
          curl --fail --location --retry 4 --retry-delay 4 https://colombia-al-dia.pages.dev/edicion-2026-11-06-18.html -o /tmp/edition.html
          grep -Fq 'Contraloría pide explicaciones por fallas en radares de El Dorado' /tmp/edition.html
          grep -Fq 'Ucrania reclama garantías de seguridad' /tmp/edition.html
          test "$(grep -c 'class="story"' /tmp/edition.html)" -eq 10
      - name: Crear audio original de hoy y MP4 final
        run: python scripts/render_orbiuno_18h.py
      - name: Verificar los flujos de audio y video
        run: |
          F=media/2026-11-06/reel_18pm.mp4
          ffprobe -v error -show_entries format=duration,size:stream=codec_type,codec_name,width,height -of json "$F"
          test "$(ffprobe -v error -select_streams a -show_entries stream=codec_type -of csv=p=0 "$F" | head -1)" = audio
          test "$(ffprobe -v error -select_streams v -show_entries stream=codec_type -of csv=p=0 "$F" | head -1)" = video
          test "$(stat -c%s "$F")" -gt 150000
      - name: Guardar el render en GitHub sin republicar contenido antiguo
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add media/2026-11-06/reel_18pm.mp4 media/2026-11-06/reel_18pm.srt media/2026-11-06/reel_18pm.json
          if git diff --cached --quiet; then echo 'Ya existe render identico'; exit 0; fi
          git commit -m 'ORBIUNO: render comprobado 18:00 con ef_dora y PULSE'
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep "$((i*3))"
          done
          exit 1
