name: "ORBIUNO MyCar | Preparación editorial 23NOV, sin publicar"
# Segunda ejecución: prueba de invitación al enlace del perfil corregida.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/edicion-23nov-preflight.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preparar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validar texto, fuentes, número de noticias y seguridad editorial
        run: |
          set -euo pipefail
          python -m py_compile scripts/build_20261123_editorial.py
          PYTHONPATH=. python scripts/build_20261123_editorial.py
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("build/edicion-2026-11-23-am/QA.json").read_text())
          assert m["verifiedArticles"]==11 and m["unlicensedPhotos"]==11
          assert not m["readyToPublish"]
          assert m["brands"]["orbiuno"]["count"]==6
          assert m["brands"]["mycar"]["count"]==5
          for brand in ("orbiuno","mycar"):
              p=Path("build/edicion-2026-11-23-am")/brand
              voice=json.loads((p/"voice_input.json").read_text())
              web=json.loads((p/"web_articles.json").read_text())
              assert len(voice["segments"])==len(web["news"])+2
              assert all(len(n["textForWebAudio"])>=640 for n in web["news"])
              assert "enlace del perfil" in voice["segments"][-1]["text"]
          print("STAGE_EDITIONS_EDITORIAL_QA_PASS_DO_NOT_PUBLISH")
          PY
      - name: Instalar Salomé y FFmpeg para generar audios de edición
        timeout-minutes: 8
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --timeout 30 --retries 2 edge-tts
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            mkdir -p "$RUNNER_TEMP/editorial-bin"
            npm install --ignore-scripts --no-audit --no-fund --no-save \
              --prefix "$RUNNER_TEMP/editorial-video-tools" \
              @ffmpeg-installer/linux-x64@4.1.0 @ffprobe-installer/linux-x64@5.2.0
            f="$RUNNER_TEMP/editorial-video-tools/node_modules/@ffmpeg-installer/linux-x64/ffmpeg"
            p="$RUNNER_TEMP/editorial-video-tools/node_modules/@ffprobe-installer/linux-x64/ffprobe"
            chmod +x "$f" "$p"
            ln -sf "$f" "$RUNNER_TEMP/editorial-bin/ffmpeg"
            ln -sf "$p" "$RUNNER_TEMP/editorial-bin/ffprobe"
            echo "$RUNNER_TEMP/editorial-bin" >> "$GITHUB_PATH"
          fi
      - name: Sintetizar borradores de voz Salomé 1.25x sin publicar
        run: |
          set -euo pipefail
          python scripts/generate_voice.py \
            --input build/edicion-2026-11-23-am/orbiuno/voice_input.json \
            --out build/edicion-2026-11-23-am/orbiuno/audio
          python scripts/generate_voice.py \
            --input build/edicion-2026-11-23-am/mycar/voice_input.json \
            --out build/edicion-2026-11-23-am/mycar/audio
          python - <<'PY'
          import json
          from pathlib import Path
          for brand,expected in (("orbiuno",8),("mycar",7)):
              p=Path("build/edicion-2026-11-23-am")/brand/"audio"
              r=json.loads((p/"audio_report.json").read_text())
              assert r["status"]=="ok" and r["voice"]=="es-CO-SalomeNeural"
              assert r["tempo"]==1.25 and len(r["segments"])==expected
              assert (p/"full.mp3").stat().st_size>5000
          print("BOTH_BRANDS_AUDIO_QA_OK__NOT_PUBLISHED")
          PY
      - name: Guardar guiones editoriales y audios sin publicar
        uses: actions/upload-artifact@v4
        with:
          name: ORBIUNO-MYCAR-20261123-0830-GUIONES
          path: build/edicion-2026-11-23-am/
          if-no-files-found: error
          retention-days: 45
