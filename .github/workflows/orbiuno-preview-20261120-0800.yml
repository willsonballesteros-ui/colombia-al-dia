name: "ORBIUNO | PREVIA 20 nov 08:00 · seis noticias (no publicar)"
on:
  push:
    branches:
      - preview/orbiuno-20261120-0800
    paths:
      - .github/workflows/orbiuno-preview-20261120-0800.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: orbiuno-preview-20261120-0800-final
  cancel-in-progress: false
jobs:
  previo:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Preparar FFmpeg npm y voz Salomé sin apt
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            mkdir -p "$RUNNER_TEMP/codec-bin"
            timeout 240s npm install --ignore-scripts --no-audit --no-fund --no-save --prefix "$RUNNER_TEMP/codecs" @ffmpeg-installer/linux-x64@4.1.0 @ffprobe-installer/linux-x64@5.2.0
            ln -sf "$RUNNER_TEMP/codecs/node_modules/@ffmpeg-installer/linux-x64/ffmpeg" "$RUNNER_TEMP/codec-bin/ffmpeg"
            ln -sf "$RUNNER_TEMP/codecs/node_modules/@ffprobe-installer/linux-x64/ffprobe" "$RUNNER_TEMP/codec-bin/ffprobe"
            chmod +x "$RUNNER_TEMP/codecs/node_modules/@ffmpeg-installer/linux-x64/ffmpeg" "$RUNNER_TEMP/codecs/node_modules/@ffprobe-installer/linux-x64/ffprobe"
            export PATH="$RUNNER_TEMP/codec-bin:$PATH"
            echo "$RUNNER_TEMP/codec-bin" >> "$GITHUB_PATH"
          fi
          test -f /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
          python -m pip install --disable-pip-version-check --timeout 20 --retries 1 --prefer-binary Pillow requests edge-tts
          python -m py_compile scripts/generate_voice.py scripts/render_orbiuno_20nov_0800_preview.py
      - name: Renderizar SOLO vista previa
        run: python scripts/render_orbiuno_20nov_0800_preview.py
      - name: QA seis fotos, voz Salomé, audio y MP4
        run: |
          python - <<'PY'
          import json, subprocess, hashlib
          from pathlib import Path
          d=Path('build/orbiuno_20nov0800')
          p=d/'ORBIUNO_20_NOV_2026_0800_6_NOTICIAS.mp4'
          report=json.loads((d/'orbiuno/audio/audio_report.json').read_text())
          news=json.loads((d/'orbiuno/editorial.json').read_text())
          photos=json.loads((d/'orbiuno/credits.json').read_text())
          assert len(news)==len(photos)==6
          assert len({n['url'] for n in news})==6
          assert report['voice']=='es-CO-SalomeNeural' and report['tempo']==1.25 and report['status']=='ok'
          assert len(report['segments'])==8
          assert len(list((d/'orbiuno').glob('slide-*.jpg')))==8
          assert all(x['license'] and x['author'] and 'commons.wikimedia.org/wiki/File:' in x['commons'] for x in photos)
          data=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_streams','-show_format','-of','json',str(p)]))
          assert any(s.get('codec_name')=='h264' and s.get('width')==1080 and s.get('height')==1920 for s in data['streams'])
          assert any(s.get('codec_name')=='aac' for s in data['streams'])
          assert p.stat().st_size>300000
          print('ORBIUNO_PREVIEW_QA_PASS',hashlib.sha256(p.read_bytes()).hexdigest(),data['format']['duration'])
          PY
      - name: Guardar PREVIA en rama aislada, nunca a main ni Meta
        run: |
          test "$GITHUB_REF_NAME" = "preview/orbiuno-20261120-0800"
          mkdir -p previews/2026-11-20/orbiuno-0800-6-final
          cp build/orbiuno_20nov0800/ORBIUNO_20_NOV_2026_0800_6_NOTICIAS.mp4 previews/2026-11-20/orbiuno-0800-6-final/
          cp build/orbiuno_20nov0800/ORBIUNO_caption.txt previews/2026-11-20/orbiuno-0800-6-final/
          cp build/orbiuno_20nov0800/orbiuno/credits.json previews/2026-11-20/orbiuno-0800-6-final/
          cp build/orbiuno_20nov0800/orbiuno/editorial.json previews/2026-11-20/orbiuno-0800-6-final/
          cp build/orbiuno_20nov0800/orbiuno/slide-*.jpg previews/2026-11-20/orbiuno-0800-6-final/
          cp build/orbiuno_20nov0800/orbiuno/audio/audio_report.json previews/2026-11-20/orbiuno-0800-6-final/
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add previews/2026-11-20/orbiuno-0800-6-final
          git commit -m 'preview ORBIUNO 20 nov 08h, no publicado'
          git push origin HEAD:preview/orbiuno-20261120-0800
      - name: Archivo de revisión descargable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ORBIUNO-20NOV-0800-6-PREVIA
          path: build/orbiuno_20nov0800/
          retention-days: 14
          if-no-files-found: warn
