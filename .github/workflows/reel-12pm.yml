name: ORBIUNO - Reel narrado de mediodia
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/render_orbiuno_12pm.py'
      - '.github/workflows/reel-12pm.yml'
permissions:
  contents: write
concurrency:
  group: orbiuno-noon-reel
  cancel-in-progress: false
jobs:
  noon:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar codificador FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - name: Instalar sintetizador gratuito de voz
        run: |
          python -m pip install --disable-pip-version-check kokoro-onnx==0.6.1 Pillow numpy soundfile
          python -m py_compile scripts/render_orbiuno_12pm.py
      - name: Obtener modelo de voz y verificar integridad
        run: |
          curl -fL --retry 3 https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx -o /tmp/kokoro-v1.0.onnx
          curl -fL --retry 3 https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin -o /tmp/voices-v1.0.bin
          echo '7d5df8ecf7d4b1878015a32686053fd0eebe2bc377234608764cc0ef3636a6c5  /tmp/kokoro-v1.0.onnx' | sha256sum --check
          echo 'bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d  /tmp/voices-v1.0.bin' | sha256sum --check
      - name: Crear video con narracion completa, introduccion y cierre
        run: python scripts/render_orbiuno_12pm.py
      - name: Validar archivo MP4 y archivos de trazabilidad
        run: |
          test -s media/2026-11-06/reel_12pm.mp4
          test -s media/2026-11-06/reel_12pm.json
          ffprobe -v error -show_entries format=duration,size:stream=codec_type,codec_name,width,height -of json media/2026-11-06/reel_12pm.mp4
      - name: Guardar video para publicacion en Metricool
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add media/2026-11-06/reel_12pm.mp4 media/2026-11-06/reel_12pm.json
          git diff --cached --quiet && exit 0
          git commit -m 'ORBIUNO: Reel 12m con diez noticias narradas y CTA'
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 4))
          done
          exit 1
