name: ORBIUNO 11 noviembre · MP4 para publicación manual
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/orbiuno-2026-11-11.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  video:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar vídeo y voz femenina
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install kokoro-onnx==0.6.1 numpy Pillow soundfile onnxruntime
      - name: Descargar y verificar Kokoro
        run: |
          curl -fL --retry 3 https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx -o /tmp/kokoro-v1.0.onnx
          curl -fL --retry 3 https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin -o /tmp/voices-v1.0.bin
          echo '7d5df8ecf7d4b1878015a32686053fd0eebe2bc377234608764cc0ef3636a6c5  /tmp/kokoro-v1.0.onnx' | sha256sum --check
          echo 'bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d  /tmp/voices-v1.0.bin' | sha256sum --check
      - name: Renderizar video 11 de noviembre, sin publicar
        run: python scripts/orbiuno_2026_11_11.py
      - name: Guardar MP4 y fuentes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ORBIUNO-2026-11-11-1330
          path: dist/orbiuno-2026-11-11/
          if-no-files-found: warn
