name: "ORBIUNO | Producción diaria de seis noticias"

on:
  push:
    branches: [main]
    paths: ['editions/daily/*.json']
  workflow_dispatch:
    inputs:
      edition_file:
        description: 'Ruta: editions/daily/AAAA-MM-DD-HHMM.json'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: orbiuno-six-daily-serial
  cancel-in-progress: false

jobs:
  producir:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Elegir exactamente el JSON del dia
        id: edition
        env:
          INPUT_FILE: '${{ github.event.inputs.edition_file }}'
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            file="$INPUT_FILE"
          else
            file="$(git diff --name-only HEAD^ HEAD | grep -E '^editions/daily/[0-9]{4}-[0-9]{2}-[0-9]{2}-(0800|1200|1800|1900)\.json$' || true)"
            if [ "$(printf '%s\n' "$file" | sed '/^$/d' | wc -l)" -ne 1 ]; then
              echo "Solo un JSON de edicion por push"; exit 1
            fi
          fi
          if [[ ! "$file" =~ ^editions/daily/[0-9]{4}-[0-9]{2}-[0-9]{2}-(0800|1200|1800|1900)\.json$ ]] || [ ! -f "$file" ]; then
            echo "Ruta invalida"; exit 1
          fi
          python - "$file" >> "$GITHUB_OUTPUT" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1]); d=json.loads(p.read_text(encoding='utf-8'))
          day=d['editionDate']; slot=d['editionSlot']
          assert slot in ('08:00','12:00','18:00','19:00')
          assert p.name==day+'-'+slot.replace(':','')+'.json'
          print('path='+str(p));print('day='+day)
          print('slot='+slot);print('stamp='+slot.replace(':',''))
          PY

      - name: No reutilizar publicaciones ni fechas caducadas
        env:
          DAY: '${{ steps.edition.outputs.day }}'
          STAMP: '${{ steps.edition.outputs.stamp }}'
        run: |
          test "$DAY" = "$(TZ=America/Bogota date +%F)"
          test ! -e "media/$DAY/orbiuno_$STAMP"_6_noticias_manifest.json

      - name: Importar seis noticias originales y validar todo
        env:
          FILE: '${{ steps.edition.outputs.path }}'
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          python scripts/orbiuno_import_daily.py --edition "$FILE"
          python scripts/validate_news.py noticias.json
          python -m py_compile scripts/render_orbiuno_6_noticias.py scripts/orbiuno_daily_preflight.py

      - name: Instalar voz y ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install edge-tts kokoro-onnx==0.6.1 numpy Pillow soundfile onnxruntime

      - name: Construir y generar voz Salomé de la edición real
        env:
          ORBIUNO_EDITION_DATE: '${{ steps.edition.outputs.day }}'
          ORBIUNO_EDITION_SLOT: '${{ steps.edition.outputs.slot }}'
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
        run: |
          python scripts/build_orbiuno_voice_input.py
          python scripts/generate_voice.py --input editions/audio_input.json --out build/audio

      - name: Bloqueo obligatorio si no hay aprobación auditiva
        env:
          VOICE_SAMPLE_APPROVED: ${{ vars.SALOME_VOICE_APPROVED }}
        run: |
          python scripts/voice_render_guard.py

      - name: Generar voz de articulos completos y actualizar web
        env:
          ORBIUNO_VOICE_ENGINE: salome
          VOICE_SAMPLE_APPROVED: ${{ vars.SALOME_VOICE_APPROVED }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
        run: |
          python scripts/generate_web_voice.py
          python scripts/prepare_site.py
          python scripts/build_feed.py

      - name: Renderizar seis laminas y portada con fecha y hora
        env:
          ORBIUNO_EDITION_DATE: '${{ steps.edition.outputs.day }}'
          ORBIUNO_EDITION_SLOT: '${{ steps.edition.outputs.slot }}'
          ORBIUNO_VOICE_ENGINE: salome
          VOICE_SAMPLE_APPROVED: ${{ vars.SALOME_VOICE_APPROVED }}
        run: python scripts/render_orbiuno_6_noticias.py

      - name: Comprobar MP4, audio, duracion e integridad
        env:
          DAY: '${{ steps.edition.outputs.day }}'
          STAMP: '${{ steps.edition.outputs.stamp }}'
        run: |
          python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          day=os.environ['DAY'];stamp=os.environ['STAMP']
          out=Path('dist')/('orbiuno-'+day+'-'+stamp)
          m=json.loads((out/'manifest.json').read_text(encoding='utf-8'))
          p=out/m['video']
          assert m['edition']==day and m['slot'].replace(':','')==stamp
          assert m['newsCount']==6 and len(set(m['newsIds']))==6
          assert m['voice']=='es-CO-SalomeNeural' and m['voiceEngine']=='salome' and m['voiceSpeed']==1.25 and m['duration']>0
          assert p.stat().st_size>100000 and hashlib.sha256(p.read_bytes()).hexdigest()==m['sha256']
          info=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_entries','stream=codec_name,width,height','-of','json',str(p)]))
          assert any(x.get('codec_name')=='h264' and x.get('width')==1080 and x.get('height')==1920 for x in info['streams'])
          assert any(x.get('codec_name')=='aac' for x in info['streams'])
          print('MP4_VALIDATED',p,m['duration'],m['sha256'])
          PY

      - name: Guardar sin tocar videos anteriores
        env:
          DAY: '${{ steps.edition.outputs.day }}'
          STAMP: '${{ steps.edition.outputs.stamp }}'
        shell: bash
        run: |
          set -euo pipefail
          folder="dist/orbiuno-$DAY-$STAMP"
          mkdir -p "media/$DAY"
          video="$(python -c 'import json,sys;print(json.load(open(sys.argv[1]))["video"])' "$folder/manifest.json")"
          test ! -e "media/$DAY/$video"
          test ! -e "media/$DAY/orbiuno_$STAMP"_6_noticias_manifest.json
          cp "$folder/$video" "media/$DAY/"
          cp "$folder/manifest.json" "media/$DAY/orbiuno_$STAMP"_6_noticias_manifest.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add noticias.json index.html feed.xml media/web-voice "media/$DAY"
          git commit -m "ORBIUNO: web MP4 voz diaria $DAY $STAMP"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Validar despliegue real de Cloudflare y seis MP3
        env:
          DAY: '${{ steps.edition.outputs.day }}'
          STAMP: '${{ steps.edition.outputs.stamp }}'
        run: |
          python scripts/orbiuno_daily_preflight.py --manifest "media/$DAY/orbiuno_$STAMP"_6_noticias_manifest.json

      - name: Guardar artefacto incluso ante falla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbiuno-daily-six
          path: |
            dist/
            build/audio/
            build/web_audio/
          if-no-files-found: warn
          retention-days: 30
