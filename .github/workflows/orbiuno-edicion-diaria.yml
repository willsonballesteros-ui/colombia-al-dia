name: "ORBIUNO | Producción diaria de seis noticias"

on:
  push:
    branches: [main]
    paths: ['editions/daily/*.json']
  pull_request:
    paths:
      - 'scripts/orbiuno_media_assets.py'
      - 'scripts/orbiuno_media_unsplash_20261121.py'
      - 'scripts/generate_web_voice_colombia.py'
      - 'scripts/render_orbiuno_aprobado.py'
      - 'scripts/orbiuno_qa_aprobado.py'
      - 'scripts/orbiuno_daily_preflight.py'
      - 'tests/test_orbiuno_aprobado.py'
      - '.github/workflows/orbiuno-edicion-diaria.yml'
  workflow_dispatch:
    inputs:
      edition_file:
        description: 'Ruta: editions/daily/AAAA-MM-DD-HHMM.json'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: orbiuno-six-daily-serial
  cancel-in-progress: false

jobs:
  verificacion_pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Pruebas adversariales aisladas, sin publicar
        run: |
          python -m pip install Pillow
          PYTHONPATH=. python -m unittest discover -s tests -p 'test_orbiuno_aprobado.py' -v
          python -m py_compile scripts/orbiuno_media_assets.py scripts/render_orbiuno_aprobado.py scripts/orbiuno_qa_aprobado.py scripts/generate_web_voice_colombia.py

  validar_binarios_pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Validar binarios H264/AAC y DejaVu sin publicar
        shell: bash
        run: |
          set -euo pipefail
          timeout 240s npm install --ignore-scripts --no-audit --no-fund --no-save \
            --prefix "$RUNNER_TEMP/orbiuno-npm" \
            @ffmpeg-installer/linux-x64@4.1.0 @ffprobe-installer/linux-x64@5.2.0
          f="$RUNNER_TEMP/orbiuno-npm/node_modules/@ffmpeg-installer/linux-x64/ffmpeg"
          p="$RUNNER_TEMP/orbiuno-npm/node_modules/@ffprobe-installer/linux-x64/ffprobe"
          test -s "$f" && test -s "$p"
          chmod +x "$f" "$p"
          test -f /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
          "$f" -version | sed -n '1p'
          "$p" -version | sed -n '1p'
          "$f" -hide_banner -encoders 2>/dev/null | grep -E 'libx264' >/dev/null
          "$f" -hide_banner -encoders 2>/dev/null | grep -E '[[:space:]]aac[[:space:]]' >/dev/null
          echo "BINARY_PREFLIGHT_PASS"

  producir:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Elegir exactamente el JSON del dia
        id: edition
        env:
          INPUT_FILE: '${{ github.event.inputs.edition_file }}'
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            file="$INPUT_FILE"
          else
            file="$(git diff --name-only HEAD^ HEAD | grep -E '^editions/daily/[0-9]{4}-[0-9]{2}-[0-9]{2}-(0800|0930|1200|1700|1800|1900)\.json$' || true)"
            if [ "$(printf '%s\n' "$file" | sed '/^$/d' | wc -l)" -ne 1 ]; then
              echo "Solo un JSON de edicion por push"; exit 1
            fi
          fi
          if [[ ! "$file" =~ ^editions/daily/[0-9]{4}-[0-9]{2}-[0-9]{2}-(0800|0930|1200|1700|1800|1900)\.json$ ]] || [ ! -f "$file" ]; then
            echo "Ruta invalida"; exit 1
          fi
          python - "$file" >> "$GITHUB_OUTPUT" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1]); d=json.loads(p.read_text(encoding='utf-8'))
          day=d['editionDate']; slot=d['editionSlot']
          assert slot in ('08:00','09:30','12:00','17:00','18:00','19:00')
          assert p.name==day+'-'+slot.replace(':','')+'.json'
          print('path='+str(p));print('day='+day)
          print('slot='+slot);print('stamp='+slot.replace(':',''))
          PY

      - name: No reutilizar publicaciones ni fechas caducadas
        env:
          DAY: '${{ steps.edition.outputs.day }}'
          STAMP: '${{ steps.edition.outputs.stamp }}'
        run: |
          test "$DAY" = "$(TZ=America/Bogota date +%F)"
          test ! -e "media/$DAY/orbiuno_$STAMP"_6_noticias_manifest.json

      - name: Importar seis noticias originales y validar todo
        env:
          FILE: '${{ steps.edition.outputs.path }}'
        run: |
          python -m pip install Pillow
          PYTHONPATH=. python -m unittest discover -s tests -p 'test_*.py'
          python scripts/orbiuno_import_daily.py --edition "$FILE"
          python scripts/validate_news.py noticias.json
          python -m py_compile scripts/render_orbiuno_aprobado.py scripts/orbiuno_qa_aprobado.py scripts/orbiuno_daily_preflight.py

      - name: Instalar voz y FFmpeg/FFprobe sin APT lento
        timeout-minutes: 8
        run: |
          set -euo pipefail
          python -m pip install --timeout 30 --retries 2 Pillow edge-tts
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            mkdir -p "$RUNNER_TEMP/orbiuno-bin"
            timeout 240s npm install --ignore-scripts --no-audit --no-fund --no-save \
              --prefix "$RUNNER_TEMP/orbiuno-npm" \
              @ffmpeg-installer/linux-x64@4.1.0 @ffprobe-installer/linux-x64@5.2.0
            ln -s "$RUNNER_TEMP/orbiuno-npm/node_modules/@ffmpeg-installer/linux-x64/ffmpeg" "$RUNNER_TEMP/orbiuno-bin/ffmpeg"
            ln -s "$RUNNER_TEMP/orbiuno-npm/node_modules/@ffprobe-installer/linux-x64/ffprobe" "$RUNNER_TEMP/orbiuno-bin/ffprobe"
            chmod +x "$RUNNER_TEMP/orbiuno-npm/node_modules/@ffmpeg-installer/linux-x64/ffmpeg"
            chmod +x "$RUNNER_TEMP/orbiuno-npm/node_modules/@ffprobe-installer/linux-x64/ffprobe"
            export PATH="$RUNNER_TEMP/orbiuno-bin:$PATH"
            echo "$RUNNER_TEMP/orbiuno-bin" >> "$GITHUB_PATH"
          fi
          test -f /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
          ffmpeg -version | sed -n '1p'
          ffprobe -version | sed -n '1p'
          ffmpeg -hide_banner -encoders 2>/dev/null | grep -E 'libx264' >/dev/null
          ffmpeg -hide_banner -encoders 2>/dev/null | grep -E '[[:space:]]aac[[:space:]]' >/dev/null
          echo "FFMPEG_FFPROBE_H264_AAC_READY"

      - name: Obtener y comprobar las seis fotos reales y logos oficiales
        env:
          FILE: '${{ steps.edition.outputs.path }}'
          DAY: '${{ steps.edition.outputs.day }}'
          STAMP: '${{ steps.edition.outputs.stamp }}'
        run: |
          if [ "$DAY" = "2026-11-21" ] && [ "$STAMP" = "0800" ]; then
            PYTHONPATH=. python scripts/orbiuno_media_unsplash_20261121.py --edition "$FILE" --news noticias.json --out "media/$DAY/${STAMP}_assets"
          else
            PYTHONPATH=. python scripts/orbiuno_media_assets.py --edition "$FILE" --news noticias.json --out "media/$DAY/${STAMP}_assets"
          fi

      - name: Generar la voz Salome es-CO 1.25x para articulos completos y actualizar web
        env:
          DAY: '${{ steps.edition.outputs.day }}'
          SLOT: '${{ steps.edition.outputs.slot }}'
        run: |
          PYTHONPATH=. python scripts/generate_web_voice_colombia.py --day "$DAY" --slot "$SLOT" --news noticias.json
          python scripts/prepare_site.py
          python scripts/build_feed.py

      - name: Renderizar seis laminas con fotos reales y Salome, sin limite de 60 segundos
        env:
          DAY: '${{ steps.edition.outputs.day }}'
          SLOT: '${{ steps.edition.outputs.slot }}'
          STAMP: '${{ steps.edition.outputs.stamp }}'
        run: |
          python scripts/render_orbiuno_aprobado.py --day "$DAY" --slot "$SLOT" --assets "media/$DAY/${STAMP}_assets" --out "dist/orbiuno-$DAY-$STAMP"

      - name: BLOQUEO DURO - fotos, logos, voz, web completa, MP4 y SHA
        env:
          DAY: '${{ steps.edition.outputs.day }}'
          STAMP: '${{ steps.edition.outputs.stamp }}'
        run: |
          PYTHONPATH=. python scripts/orbiuno_qa_aprobado.py \
            --manifest "dist/orbiuno-$DAY-$STAMP/manifest.json" \
            --assets "media/$DAY/${STAMP}_assets" \
            --news noticias.json \
            --webvoice media/web-voice/manifest.json

      - name: Guardar sin tocar videos anteriores
        env:
          DAY: '${{ steps.edition.outputs.day }}'
          STAMP: '${{ steps.edition.outputs.stamp }}'
        shell: bash
        run: |
          set -euo pipefail
          folder="dist/orbiuno-$DAY-$STAMP"
          mkdir -p "media/$DAY"
          video="$(python -c 'import json,sys;print(json.load(open(sys.argv[1]))["video"])' "$folder/manifest.json")"
          test ! -e "media/$DAY/$video"
          test ! -e "media/$DAY/orbiuno_$STAMP"_6_noticias_manifest.json
          cp "$folder/$video" "media/$DAY/"
          cp "$folder/manifest.json" "media/$DAY/orbiuno_$STAMP"_6_noticias_manifest.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add noticias.json index.html feed.xml media/web-voice "media/$DAY"
          git commit -m "ORBIUNO: web MP4 voz diaria $DAY $STAMP"
          # El generador del sitio también actualiza index.html y puede
          # publicar un commit mientras el Reel se está procesando.
          # Rebase con preferencia por los artefactos de esta edición y
          # reconstrucción del HTML desde el JSON resultante antes del push.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase -X theirs origin/main; then
              git rebase --abort || true
              echo 'MERGE_UNSAFE: no se publicó ninguna red social' >&2
              exit 1
            fi
            python scripts/validate_news.py noticias.json
            python scripts/prepare_site.py
            python scripts/build_feed.py
            python scripts/stage_cloudflare_site.py --out site
            git add noticias.json index.html feed.xml media/web-voice "media/$DAY" site
            if ! git diff --cached --quiet; then
              git commit -m "ORBIUNO: reconciliar web y medios $DAY $STAMP"
            fi
            if git push origin HEAD:main; then
              echo 'ORBIUNO_MP4_WEB_PUSH_CONFIRMED'
              break
            fi
            if [ "$attempt" = 5 ]; then
              echo 'PUSH_RETRY_EXHAUSTED sin publicar Instagram' >&2
              exit 1
            fi
            sleep "$((attempt * 3))"
          done

      - name: Validar despliegue real de Cloudflare y seis MP3
        env:
          DAY: '${{ steps.edition.outputs.day }}'
          STAMP: '${{ steps.edition.outputs.stamp }}'
        run: |
          python scripts/orbiuno_daily_preflight.py --manifest "media/$DAY/orbiuno_$STAMP"_6_noticias_manifest.json

      - name: Publicar en Instagram solamente con seis medios, web y MP4 verificados
        if: steps.edition.outputs.day == '2026-11-21' && steps.edition.outputs.stamp == '0800'
        env:
          DAY: '${{ steps.edition.outputs.day }}'
          STAMP: '${{ steps.edition.outputs.stamp }}'
          ORBIUNO_IG_ACCESS_TOKEN: ${{ secrets.ORBIUNO_IG_ACCESS_TOKEN }}
          ORBIUNO_IG_USER_ID: ${{ secrets.ORBIUNO_IG_USER_ID }}
        run: |
          python scripts/orbiuno_publish_6.py --manifest "media/$DAY/orbiuno_${STAMP}_6_noticias_manifest.json"

      - name: Registrar la publicación con ID y enlace verificables
        if: always() && steps.edition.outputs.day == '2026-11-21'
        uses: actions/upload-artifact@v4
        with:
          name: orbiuno-20261121-0800-publicacion
          path: media/2026-11-21/publication_report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Guardar artefacto incluso ante falla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbiuno-daily-six
          path: dist/
          if-no-files-found: warn
          retention-days: 30
