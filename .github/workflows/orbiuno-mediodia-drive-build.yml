name: ORBIUNO mediodia 09 nov - producir video (SIN PUBLICAR)
on:
  push:
    branches: [orbiuno-mediodia-2026-11-09-fix]
    paths: [.github/workflows/orbiuno-mediodia-drive-build.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  producir:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar FFmpeg y dependencias
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install -U pip gdown
      - name: Descargar paquete editorial de Google Drive
        run: |
          gdown '1AiW3fQxNxgxj4sLtkMMJBWQQeIbrUH_q' -O /tmp/orbiuno.zip
          unzip -t /tmp/orbiuno.zip
          unzip -q /tmp/orbiuno.zip -d /tmp/orbiuno-src
          test -f /tmp/orbiuno-src/orbiuno/scripts/build_edition.py
          test -f /tmp/orbiuno-src/orbiuno/editions/2026-11-09-mediodia.json
      - name: Usar fuente oficial COP31 cuando medio secundario bloquea robots
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('/tmp/orbiuno-src/orbiuno/editions/2026-11-09-mediodia.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          article=data['stories'][2]
          article['sources']=[u for u in article['sources'] if not u.startswith('https://unsdg.un.org/')]
          article['verification'] += ' Referencia secundaria excluida por HTTP 403 en GitHub; se conserva UNFCCC.'
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2), encoding='utf-8')
          PY
      - name: Instalar generador de Claude
        run: |
          python -m pip install -r /tmp/orbiuno-src/orbiuno/requirements.txt
      - name: Producir MP4 narrado con fotografias y musica
        run: |
          cd /tmp/orbiuno-src/orbiuno
          python scripts/build_edition.py editions/2026-11-09-mediodia.json --out "$GITHUB_WORKSPACE/out" --engine edge
      - name: Validar estructura de video
        run: |
          test -s out/orbiuno.mp4
          ffprobe -v error -show_entries format=duration -of default=nw=1 out/orbiuno.mp4
          ffprobe -v error -show_entries stream=codec_name,width,height -of default=nw=1 out/orbiuno.mp4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ORBIUNO-mediodia-09nov-video-e-informe
          path: |
            out/orbiuno.mp4
            out/orbiuno_RECHAZADO.mp4
            out/informe.md
            out/informe.json
            out/timeline.json
          if-no-files-found: warn
