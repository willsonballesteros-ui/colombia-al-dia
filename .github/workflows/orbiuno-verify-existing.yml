name: ORBIUNO | Verificar web y MP4 existente
on:
  push:
    branches: [main]
    paths: ['.github/workflows/orbiuno-verify-existing.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: orbiuno-web-verification
  cancel-in-progress: false
jobs:
  verificar:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pruebas sin publicar
        run: |
          python -m py_compile scripts/verify_public_edition.py
          python scripts/verify_public_edition.py --test
      - name: Confirmar sitio, video, seis fotos, logos y audios
        run: |
          set -euo pipefail
          day=$(TZ=America/Bogota date +%F)
          hour=$(TZ=America/Bogota date +%H)
          if (( 10#$hour >= 17 )); then slot=1800
          elif (( 10#$hour >= 8 )); then slot=0800
          else exit 1; fi
          python scripts/verify_public_edition.py --day "$day" --slot "$slot"
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: orbiuno-public-web-verification
          path: /tmp/orbiuno-preflight.json
          if-no-files-found: error
