name: ORBIUNO | Verificar web y MP4 existente
on:
  push:
    branches: [main]
    paths: ['.github/workflows/orbiuno-verify-existing.yml']
  schedule:
    - cron: '45 12,22 * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ['Editorial | Producción diaria por marca']
    types: [completed]
permissions:
  contents: read
concurrency:
  group: orbiuno-web-verification
  cancel-in-progress: false
jobs:
  verificar:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pruebas sin publicar
        run: |
          python -m py_compile scripts/verify_public_edition.py
          python scripts/verify_public_edition.py --test
      - name: Confirmar sitio, video, seis fotos, logos y audios
        run: |
          set -euo pipefail
          day=$(TZ=America/Bogota date +%F)
          hour=$(TZ=America/Bogota date +%H)
          if (( 10#$hour >= 17 )); then slot=1800
          elif (( 10#$hour >= 7 )); then slot=0800
          else exit 1; fi
          test -s "media/$day/edicion-$slot-orbiuno/orbiuno_manifest.json"
          python scripts/verify_public_edition.py --day "$day" --slot "$slot"
