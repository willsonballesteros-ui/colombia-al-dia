name: Editorial | Pruebas de recuperación sin publicar
on:
  pull_request:
    paths:
      - 'tools/editorial/produce_20261126_0800.py'
      - 'tools/editorial/sync_orbiuno_20261126_0800.py'
      - 'tests/test_editorial_dynamic_recovery.py'
      - '.github/workflows/editorial-recovery-tests.yml'
      - '.github/workflows/orbiuno-publicar-verificado.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow requests
      - run: python -m py_compile tools/editorial/produce_20261126_0800.py tools/editorial/sync_orbiuno_20261126_0800.py
      - run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_editorial_dynamic_recovery.py' -v
