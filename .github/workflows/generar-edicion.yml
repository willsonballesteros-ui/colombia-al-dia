name: Generar edición ORBIUNO (voz + Reel + Story, no publica)

on:
  workflow_dispatch:
    inputs:
      edition_id:
        description: 'Ej. 2026-11-07-0800'
        required: true
permissions:
  contents: read

concurrency:
  group: fase3-edicion-${{ inputs.edition_id }}
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dependencias del sistema
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - name: Dependencias de Python
        run: python -m pip install kokoro-onnx==0.6.1 soundfile numpy Pillow faster-whisper

      - name: Modelo y voces Kokoro (SHA-256 verificado)
        run: |
          curl --fail --location --retry 3 https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx -o /tmp/kokoro-v1.0.onnx
          curl --fail --location --retry 3 https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin -o /tmp/voices-v1.0.bin
          echo '7d5df8ecf7d4b1878015a32686053fd0eebe2bc377234608764cc0ef3636a6c5  /tmp/kokoro-v1.0.onnx' | sha256sum --check
          echo 'bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d  /tmp/voices-v1.0.bin' | sha256sum --check

      - name: Pruebas automatizadas
        run: python -m unittest discover -s tests -p 'test_orbiuno_edition.py'

      - name: Generar vista previa (voz ef_dora real, 1080x1920)
        env:
          EDITION_ID: ${{ inputs.edition_id }}
        run: |
          [[ "$EDITION_ID" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}-(0800|1200|1800)$ ]] || exit 2
          if [ -f "editions/$EDITION_ID.json" ]; then
            python scripts/merge_edition.py "editions/$EDITION_ID.json"
          fi
          args=()
          if [ -f assets/audio/orbiuno-pulse.m4a ]; then args+=(--music assets/audio/orbiuno-pulse.m4a); fi
          python scripts/render_orbiuno_edition.py --edition "$EDITION_ID" --preview "${args[@]}"

      - name: Comprobar inteligibilidad (Whisper) sobre el MP4 final
        env:
          EDITION_ID: ${{ inputs.edition_id }}
        run: |
          python - <<'PYTHON' > /tmp/guion.txt
          import json
          import os
          m = json.load(open(f"media/{os.environ['EDITION_ID']}/reel-manifest.json", encoding="utf-8"))
          print(" ".join(s["text"] for s in m["scenes"]))
          PYTHON
          python scripts/verify_voice.py --audio "media/$EDITION_ID/reel.mp4" --text "$(cat /tmp/guion.txt)" --asr --report /tmp/asr-reporte.json

      - name: Subir resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edicion-${{ inputs.edition_id }}
          path: |
            media/${{ inputs.edition_id }}/
            /tmp/asr-reporte.json
          if-no-files-found: warn
