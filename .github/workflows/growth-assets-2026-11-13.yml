name: Assets reales + Dora 13nov | SOLO REVISIÓN
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/growth-assets-2026-11-13.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  assets_sin_publicar:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Instalar motor
        run: |
          python -m pip install kokoro-onnx==0.6.1 soundfile pillow
          curl --fail --location --retry 3 https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx -o /tmp/kokoro-v1.0.onnx
          curl --fail --location --retry 3 https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin -o /tmp/voices-v1.0.bin
          echo '7d5df8ecf7d4b1878015a32686053fd0eebe2bc377234608764cc0ef3636a6c5  /tmp/kokoro-v1.0.onnx' | sha256sum --check
          echo 'bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d  /tmp/voices-v1.0.bin' | sha256sum --check
      - name: Descargar fotos reales y sintetizar voz
        run: python scripts/growth_assets_2026_11_13.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ORBIUNO-MYCAR-ASSETS-DORA-PARA-REVISION
          path: dist/revision-13nov/
          if-no-files-found: warn
          retention-days: 30
