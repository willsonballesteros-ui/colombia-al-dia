name: ORBIUNO - Reel de seguimiento reconstruido y validado
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reel-reemplazo-1330.yml'
      - 'scripts/render_orbiuno_reemplazo.py'
      - 'editorial/2026-11-06-reemplazo-1330.json'
permissions:
  contents: write
concurrency:
  group: orbiuno-reemplazo-edicion-20261106
  cancel-in-progress: false
jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar FFmpeg, Pillow, Kokoro y dependencias
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install --disable-pip-version-check kokoro-onnx==0.6.1 Pillow==12.0.0 numpy soundfile
          python -m py_compile scripts/render_orbiuno_reemplazo.py
      - name: Descargar voz de acceso gratuito con SHA verificados
        run: |
          curl -fL --retry 3 https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx -o /tmp/kokoro-v1.0.onnx
          curl -fL --retry 3 https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin -o /tmp/voices-v1.0.bin
          echo '7d5df8ecf7d4b1878015a32686053fd0eebe2bc377234608764cc0ef3636a6c5  /tmp/kokoro-v1.0.onnx' | sha256sum --check
          echo 'bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d  /tmp/voices-v1.0.bin' | sha256sum --check
      - name: Crear Reel con dos bloques y fotos auténticas acreditadas
        run: python scripts/render_orbiuno_reemplazo.py
      - name: Comprobar video, audio, duración, créditos y ausencia de subtítulos
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("media/2026-11-06")
          meta=json.loads((p/"reel_reemplazo_1330.json").read_text())
          assert meta["newsCount"]==8 and meta["newsRepeatedFromMorning"]==0
          assert meta["subtitles"] is False and meta["voice"]=="ef_dora"
          assert meta["voiceSpeed"]==1.25 and meta["audioStreamVerified"]
          assert all(meta["logosPresent"].values()), "Falta favicon genuino de algún medio"
          assert 30<=meta["durationSeconds"]<=90
          assert len(meta["photoCredits"])==2
          assert (p/"reel_reemplazo_1330.mp4").stat().st_size>100000
          print("VALIDACIÓN FINAL",json.dumps(meta,ensure_ascii=False))
          PY
          ffprobe -v error -show_entries format=duration,size:stream=codec_type,codec_name,width,height -of json media/2026-11-06/reel_reemplazo_1330.mp4
      - name: Guardar reel validado y capturas de control
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add media/2026-11-06/reel_reemplazo_1330.mp4 media/2026-11-06/reel_reemplazo_1330.json media/2026-11-06/reel_reemplazo_1330_portada.png media/2026-11-06/reel_reemplazo_1330_bloque1.png media/2026-11-06/reel_reemplazo_1330_bloque2.png
          git diff --cached --quiet && exit 0
          git commit -m "ORBIUNO: entregar Reel nuevo comprobado, sin repeticiones"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 4))
          done
          exit 1
