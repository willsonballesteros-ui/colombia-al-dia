name: ORBIUNO | 25NOV 18h producción y web
# Corrección de literal numérico del límite de descarga.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/orbiuno-20261125-1800.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: orbiuno-20261125-1800
  cancel-in-progress: false
jobs:
  producir_y_web:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      NEWS_BRAND: 'orbiuno'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias y verificar código
        run: |
          python -m pip install -q Pillow requests edge-tts
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; fi
          python -m py_compile tools/editorial/produce_20261125_1800.py tools/editorial/sync_orbiuno_20261125_1800.py
      - name: Renderizar y validar la edición con medios reales
        run: |
          set -euo pipefail
          PYTHONPATH=. python tools/editorial/produce_20261125_1800.py
          python - <<'PY'
          import json,os,hashlib,subprocess
          from pathlib import Path
          b=os.environ["NEWS_BRAND"]; p=Path("media/2026-11-25/edicion-1800-"+b)
          m=json.loads((p/(b+"_manifest.json")).read_text())
          n=6 if b=="orbiuno" else 5
          assert m["newsCount"]==m["imagesCount"]==m["logosCount"]==m["fullNewsAudioFiles"]==n
          assert m["voice"]=="es-CO-SalomeNeural" and m["voiceSpeed"]==1.25
          assert all(x["rightsVerified"] for x in m["photoCredits"])
          assert hashlib.sha256((p/m["video"]).read_bytes()).hexdigest()==m["sha256"]
          for i in range(1,n+1):
              assert (p/f"{b}-noticia-{i:02d}.mp3").stat().st_size>1000
          subprocess.run(["ffmpeg","-v","error","-i",str(p/m["video"]),"-f","null","-"],check=True)
          print("MEDIA_QA_PASS",b,m["duration"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: orbiuno-20261125-1800-approved
          path: media/2026-11-25/edicion-1800-orbiuno/
          if-no-files-found: error
      - name: Sincronizar únicamente orbiuno
        run: |
          set -euo pipefail
          src=media/2026-11-25/edicion-1800-orbiuno
          mkdir -p "site/$src"
          cp -a "$src/." "site/$src/"
          PYTHONPATH=. python tools/editorial/sync_orbiuno_20261125_1800.py
          python scripts/build_feed.py
          mkdir -p site/media/web-voice
          cp orbiuno-2026-11-25-1800.html noticias.json index.html feed.xml site/
          cp media/web-voice/manifest.json site/media/web-voice/manifest.json
          git add noticias.json index.html feed.xml media/web-voice/manifest.json site/noticias.json site/index.html site/feed.xml site/media/web-voice/manifest.json orbiuno-2026-11-25-1800.html site/orbiuno-2026-11-25-1800.html
          git add "$src" "site/$src"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'orbiuno: edición 25NOV 18h aprobada'
          for i in 1 2 3; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
      - name: Verificar el sitio y medios públicos antes de publicar
        run: python scripts/verify_public_edition.py --day 2026-11-25 --slot 1800
      - uses: actions/upload-artifact@v4
        with:
          name: orbiuno-20261125-1800-web-verified
          path: /tmp/orbiuno-preflight.json
          if-no-files-found: error
