name: ORBIUNO - Validar PR sin publicar
on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'noticias.json'
      - 'index.html'
      - '.github/workflows/verificar-pr-orbiuno.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias para las pruebas audiovisuales
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install Pillow==11.3.0
      - name: Verificar pruebas sin Meta ni publicaciones
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Completar metadatos de idioma como hace el flujo de producción
        run: python scripts/prepare_audio.py noticias.json
      - name: Validar datos editoriales
        run: python scripts/validate_news.py noticias.json
      - name: Sintaxis del publicador y generadores
        run: python -m compileall -q scripts tests

  camila-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar FFprobe para comprobar los archivos auténticos
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Descargar los 12 WAV reales y comprobar SHA-256/ffprobe
        run: python scripts/orbiuno_pipeline/materialize_camila_audio.py
      - name: Guardar paquete auténtico de voz de Camila (NO PUBLICAR)
        uses: actions/upload-artifact@v4
        with:
          name: ORBIUNO-CAMILA-12-WAV-REAL-NO-PUBLICAR
          path: |
            dist/orbiuno_camila_12_audio.zip
            editions/2026-11-11-0800-5news/audio_evidence.json
          if-no-files-found: error
          retention-days: 7
