name: ORBIUNO 19h - recuperar Dora y generar MP4 (sin publicar)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/orbiuno-dora-1900-render.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: orbiuno-dora-1900-render
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install kokoro-onnx==0.6.1 numpy Pillow soundfile onnxruntime
      - name: Recuperar Dora con verificacion SHA256
        run: |
          curl --fail --location --retry 5 --retry-all-errors https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx -o /tmp/kokoro-v1.0.onnx
          curl --fail --location --retry 5 --retry-all-errors https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin -o /tmp/voices-v1.0.bin
          echo '7d5df8ecf7d4b1878015a32686053fd0eebe2bc377234608764cc0ef3636a6c5  /tmp/kokoro-v1.0.onnx' | sha256sum --check
          echo 'bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d  /tmp/voices-v1.0.bin' | sha256sum --check
      - name: Generar seis noticias con Dora sin publicar
        env:
          ORBIUNO_EDITION_SLOT: '19:00'
        run: python scripts/render_orbiuno_6_noticias.py
      - name: Conservar video en repositorio sin alterar edicion anterior
        run: |
          set -euo pipefail
          mkdir -p media/2026-11-15
          cp dist/orbiuno-2026-11-15-1900/ORBIUNO_2026-11-15_1900_6_NOTICIAS.mp4 media/2026-11-15/
          cp dist/orbiuno-2026-11-15-1900/manifest.json media/2026-11-15/orbiuno_1900_dora_manifest.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add media/2026-11-15/ORBIUNO_2026-11-15_1900_6_NOTICIAS.mp4 media/2026-11-15/orbiuno_1900_dora_manifest.json
          git commit -m 'ORBIUNO 19h: MP4 Dora validado, sin publicar'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Evidencia MP4
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ORBIUNO-2026-11-15-1900-DORA
          path: dist/orbiuno-2026-11-15-1900/
          if-no-files-found: warn
