name: ORBIUNO | Publicar por API Meta sin Metricool
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validar sin publicar'
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: orbiuno-meta-publisher
  cancel-in-progress: false
jobs:
  publicacion:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Comprobar reglas contra duplicados
        run: python -m unittest discover -s tests -p 'test_publishing_queue.py' -v
      - name: Publicar publicaciones vencidas de la cola
        env:
          IG_USER_ID: ${{ secrets.ORBIUNO_IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.ORBIUNO_IG_ACCESS_TOKEN }}
          IG_GRAPH_VERSION: v26.0
          FB_PAGE_ID: ${{ secrets.ORBIUNO_FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.ORBIUNO_FB_PAGE_ACCESS_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$DRY_RUN" = "true" ]; then
            python scripts/publishing_queue.py --dry-run
          else
            git config user.name 'orbiuno-publisher-bot'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            python scripts/publishing_queue.py --persist-attempt
          fi
      - name: Guardar estado verificado o error para evitar duplicados
        if: always() && (github.event_name != 'workflow_dispatch' || !inputs.dry_run)
        run: |
          if ! git diff --quiet -- data/publishing_queue.json; then
            git config user.name 'orbiuno-publisher-bot'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/publishing_queue.json
            git commit -m 'chore: persist ORBIUNO publishing state [skip ci]'
            git push origin HEAD:refs/heads/main
          fi
