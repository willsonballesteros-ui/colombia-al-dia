name: MyCar | Actualizar noticias de Busco Autos
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'media/**/mycar*/editorial.json'
      - 'media/**/mycar*/credits.json'
      - 'media/**/mycar*/*.mp4'
      - 'media/**/edicion-*-mycar/mycar_manifest.json'
      - 'scripts/build_mycar_news_feed.py'
      - '.github/workflows/mycar-news-feed.yml'
  schedule:
    - cron: '40 13,23 * * *' # 08:40 y 18:40 hora de Bogotá
permissions:
  contents: write
concurrency:
  group: mycar-news-feed
  cancel-in-progress: false
jobs:
  actualizar-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reconstruir feed solo de ediciones acreditadas
        run: python scripts/build_mycar_news_feed.py
      - name: Verificar JSON del portal
        run: |
          python -m json.tool data/mycar-noticias.json > /dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          f=json.loads(Path('data/mycar-noticias.json').read_text())
          assert f['schema_version']==1
          assert all(len(x['items']) in (4,5) for x in f['editions'])
          print('MYCAR_FEED_READY',len(f['editions']))
          PY
      - name: Guardar cambios comprobados
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/build_mycar_news_feed.py
            mkdir -p site/data
            cp data/mycar-noticias.json site/data/mycar-noticias.json
            python -m json.tool site/data/mycar-noticias.json >/dev/null
            git add data/mycar-noticias.json site/data/mycar-noticias.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'MyCar: sincronizar archivo público de noticias'
            if git push origin HEAD:main; then exit 0; fi
            sleep "$((attempt*2))"
          done
          exit 1
