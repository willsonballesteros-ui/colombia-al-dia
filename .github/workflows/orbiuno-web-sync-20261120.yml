name: "ORBIUNO | Sincronizar web pública 20nov 08:00 · sin Meta"
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/orbiuno-web-sync-20261120.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: orbiuno-website-sync-20261120-0800
  cancel-in-progress: false
jobs:
  publicar_web:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Preparar paquetes sin solicitudes Wikimedia
        run: |
          python -m pip install --disable-pip-version-check --prefer-binary Pillow edge-tts
          python -m py_compile scripts/orbiuno_web_sync_cached_20261120.py scripts/orbiuno_import_daily.py scripts/generate_web_voice_colombia.py scripts/prepare_site.py
      - name: Descargar artefacto ORIGINAL de QA visual del Reel sin republicarlo
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/orbiuno-reviewed"
          gh run download 44733147573 --repo "$GH_REPO" \
            --name 'ORBIUNO-20NOV-0800-6-PREVIA' --dir "$RUNNER_TEMP/orbiuno-reviewed"
          test -s "$RUNNER_TEMP/orbiuno-reviewed/orbiuno/credits.json"
          test -s "$RUNNER_TEMP/orbiuno-reviewed/orbiuno/editorial.json"
          for i in 00 01 02 03 04 05; do
            test -s "$RUNNER_TEMP/orbiuno-reviewed/orbiuno/photo-$i.jpg"
          done
          echo 'QA_ORIGINAL_ARTIFACT_RECOVERED'
      - name: Importar exclusivamente seis artículos originales sin duplicar archivo histórico
        run: |
          python scripts/orbiuno_import_daily.py \
            --edition editions/daily/2026-11-20-0800.json --news noticias.json
          python scripts/validate_news.py noticias.json
      - name: Validar créditos y copiar las seis fotografías previamente revisadas
        shell: bash
        run: |
          set -euo pipefail
          python scripts/orbiuno_web_sync_cached_20261120.py \
            --edition editions/daily/2026-11-20-0800.json \
            --cache "$RUNNER_TEMP/orbiuno-reviewed/orbiuno" \
            --news noticias.json --out media/2026-11-20/0800_assets
      - name: Generar los seis MP3 COMPLETOS de los artículos con Salomé
        run: |
          PYTHONPATH=. python scripts/generate_web_voice_colombia.py --day 2026-11-20 --slot 08:00 --news noticias.json
          python scripts/prepare_site.py
          python scripts/build_feed.py
      - name: QA editorial, fotografías, textos y audios completos antes de subir
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.generate_voice import duration_sec
          news=json.loads(Path('noticias.json').read_text(encoding='utf-8'))['news']
          slot=[n for n in news if n.get('date')=='2026-11-20' and n.get('editionSlot')=='08:00']
          manifest=json.loads(Path('media/web-voice/manifest.json').read_text(encoding='utf-8'))
          assert len(slot)==6 and len({n['id'] for n in slot})==6
          assert manifest['voice']=='es-CO-SalomeNeural'
          assert manifest['baseRate']==1.25
          page=Path('index.html').read_text(encoding='utf-8')
          for n in slot:
              assert n['verification']=='editorial_verified'
              assert n['imageRightsVerified'] is True
              assert n['imageCredit'] and n['imageLicense'] and n['imageSourceUrl']
              assert n['title'] in page
              assert n['id'] in manifest['items']
              row=manifest['items'][n['id']]
              assert row['voice']=='es-CO-SalomeNeural' and row['speed']==1.25
              assert row['text']==n['originalArticleTextEs']
              media=Path('media/web-voice')/Path(row['url']).name
              assert media.stat().st_size > 4000 and duration_sec(media)>10
              photo=Path(n['imageUrl'].removeprefix('./'))
              assert photo.is_file() and photo.stat().st_size>12000
          print('ORBIUNO_WEB_0800_SIX_FULL_ARTICLES_SIX_AUDIO_QA_PASS')
          PY
      - name: Actualizar SOLO web, RSS, seis fotos y seis audios; no tocar Meta
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add noticias.json index.html feed.xml media/web-voice media/2026-11-20/0800_assets
          if git diff --cached --quiet; then
            echo 'SYNCHRONIZATION_ALREADY_APPLIED'
            exit 0
          fi
          git commit -m 'ORBIUNO 20nov 08:00: web 6 noticias 6 audios fotos verificadas'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          echo 'ORBIUNO_WEB_CODE_PUSHED_WAIT_DEPLOY'
      - name: Verificar Cloudflare Pages real, fecha, titulares y seis MP3 accesibles
        run: |
          python - <<'PY'
          import json,time,urllib.request
          from pathlib import Path
          news=json.loads(Path('noticias.json').read_text(encoding='utf-8'))['news']
          slot=[n for n in news if n.get('date')=='2026-11-20' and n.get('editionSlot')=='08:00']
          mp3=json.loads(Path('media/web-voice/manifest.json').read_text(encoding='utf-8'))
          base='https://colombia-al-dia.pages.dev/'
          error=''
          for retry in range(14):
              try:
                  with urllib.request.urlopen(urllib.request.Request(base,headers={'User-Agent':'ORBIUNO-Web-QA/1.0'}),timeout=12) as f:
                      page=f.read(3_000_000).decode('utf-8')
                  if not all(n['title'] in page and n['id'] in page for n in slot):
                      raise RuntimeError('Cloudflare aún sirve versión anterior')
                  for n in slot:
                      url=base+mp3['items'][n['id']]['url'].removeprefix('./')
                      req=urllib.request.Request(url,headers={'User-Agent':'ORBIUNO-Web-QA/1.0','Range':'bytes=0-256'})
                      with urllib.request.urlopen(req,timeout=12) as f:
                          assert f.status in (200,206) and len(f.read(128))>50
                  print('PUBLIC_CLOUDFLARE_ORBIUNO_0800_SIX_NEWS_SIX_AUDIO_PASS')
                  break
              except Exception as exc:
                  error=str(exc)
                  print('RETRY_CLOUDFLARE_DEPLOY',retry+1,error[:140],flush=True)
                  if retry==13:raise RuntimeError('Sin confirmación despliegue web: '+error)
                  time.sleep(12)
          PY

# Reintento 2: conservar fotos en 0800_assets cuando su SHA256 y licencia coincidan con preverified_sources.json.

# Reintento 3: normalizar ruta absoluta del caché verificado sin tocar fotos existentes.

# Reintento 4: resolver importación del paquete scripts sin alterar fuente de audio.
