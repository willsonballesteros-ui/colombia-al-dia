name: Vista previa | ORBIUNO y MyCar 14 noviembre 2026
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/previa-both-20261114.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: preview-only-orbiuno-mycar-20261114
  cancel-in-progress: false
jobs:
  produce:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar herramientas audiovisuales
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install 'kokoro-onnx==0.6.1' Pillow numpy soundfile
          curl --fail --location --retry 3 https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx -o /tmp/kokoro-v1.0.onnx
          curl --fail --location --retry 3 https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin -o /tmp/voices-v1.0.bin
          echo '7d5df8ecf7d4b1878015a32686053fd0eebe2bc377234608764cc0ef3636a6c5  /tmp/kokoro-v1.0.onnx' | sha256sum --check
          echo 'bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d  /tmp/voices-v1.0.bin' | sha256sum --check
      - name: Generar diez escenas con imágenes reales y voz Dora
        run: |
          python scripts/preview_both_20261114.py
      - name: Verificar que los borradores no publican
        run: |
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          folder=Path("media/2026-11-14-borradores")
          for name,n in [("ORBIUNO",6),("MYCAR",4)]:
              meta=json.loads((folder/(name.lower()+"-credits.json")).read_text())
              mp4=folder/(name+"-2026-11-14_BORRADOR_"+str(n)+"_NOTICIAS.mp4")
              assert meta["status"]=="DRAFT_NOT_PUBLISHED"
              assert len(meta["stories"])==n and len(meta["license_photos"])==n
              streams=json.loads(subprocess.check_output(["ffprobe","-v","error","-show_streams","-show_format","-of","json",str(mp4)]))
              assert any(x["codec_type"]=="audio" for x in streams["streams"])
              assert any(x["codec_type"]=="video" and x.get("width")==720 and x.get("height")==1280 for x in streams["streams"])
              print("PREVIEW_VALIDATED",name,meta["sha256"],flush=True)
          PY
      - name: Conservar MP4 y créditos para revisión sin publicar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VISTAS-PREVIAS-ORBIUNO-MYCAR-2026-11-14
          path: |
            media/2026-11-14-borradores/*.mp4
            media/2026-11-14-borradores/*-credits.json
          retention-days: 30
          if-no-files-found: ignore
