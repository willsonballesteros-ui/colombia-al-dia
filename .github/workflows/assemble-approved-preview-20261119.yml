name: Reconstruct approved preview MP4 (not publishing)
on:
  push:
    branches:
      - preview/approved-v2-20261119-1000
    paths:
      - '_media_staging/2026-11-19/**'
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble and validate approved videos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p previews/2026-11-19/mycar-1000-5-v2 previews/2026-11-19/orbiuno-1000-6-v2
          cat _media_staging/2026-11-19/mycar/part-*.b64 | base64 --decode > previews/2026-11-19/mycar-1000-5-v2/MYCAR_19_NOV_2026_1000_5_NOTICIAS_REVISION_V2.mp4
          cat _media_staging/2026-11-19/orbiuno/part-*.b64 | base64 --decode > previews/2026-11-19/orbiuno-1000-6-v2/ORBIUNO_19_NOV_2026_1000_6_NOTICIAS_V2_OPTIMIZADO.mp4
          printf '%s\n' '0ad4da834c0860f6a87e1f10dc5f190bec9b1bb58d109b34d01326ba041a339c  previews/2026-11-19/mycar-1000-5-v2/MYCAR_19_NOV_2026_1000_5_NOTICIAS_REVISION_V2.mp4' | sha256sum --check
          printf '%s\n' '75a5c5da3814c64a0174331a84613286dca83563db1df22ef0783de74d622fc8  previews/2026-11-19/orbiuno-1000-6-v2/ORBIUNO_19_NOV_2026_1000_6_NOTICIAS_V2_OPTIMIZADO.mp4' | sha256sum --check
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 previews/2026-11-19/mycar-1000-5-v2/MYCAR_19_NOV_2026_1000_5_NOTICIAS_REVISION_V2.mp4
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 previews/2026-11-19/orbiuno-1000-6-v2/ORBIUNO_19_NOV_2026_1000_6_NOTICIAS_V2_OPTIMIZADO.mp4
      - name: Save public, versioned previews
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add previews/2026-11-19/mycar-1000-5-v2/*.mp4 previews/2026-11-19/orbiuno-1000-6-v2/*.mp4
          git diff --cached --quiet && exit 0
          git commit -m 'Add approved ORBIUNO and MyCar V2 preview videos [skip ci]'
          git push origin HEAD:preview/approved-v2-20261119-1000
