name: Verificar voz Kokoro (solo prueba, no publica)

on:
  workflow_dispatch:
  push:
    branches: ['orbiuno/fase3-validacion']
    paths:
      - 'scripts/verify_voice.py'
      - '.github/workflows/verificar-voz.yml'

permissions:
  contents: read

jobs:
  voz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Instalar Kokoro y Whisper (mismas versiones que el flujo de producción)
        run: python -m pip install kokoro-onnx==0.6.1 soundfile numpy faster-whisper

      - name: Descargar modelo y voces (con verificación SHA-256 del repo)
        run: |
          curl --fail --location --retry 3 https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx -o /tmp/kokoro-v1.0.onnx
          curl --fail --location --retry 3 https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin -o /tmp/voices-v1.0.bin
          echo '7d5df8ecf7d4b1878015a32686053fd0eebe2bc377234608764cc0ef3636a6c5  /tmp/kokoro-v1.0.onnx' | sha256sum --check
          echo 'bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d  /tmp/voices-v1.0.bin' | sha256sum --check

      - name: Sintetizar ef_dora en español y validar
        run: python scripts/verify_voice.py --synthesize --asr --out /tmp/voz-prueba.mp3 --report /tmp/voz-reporte.json

      - name: Subir audio y reporte como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voz-prueba-ef_dora
          path: |
            /tmp/voz-prueba.mp3
            /tmp/voz-reporte.json
          if-no-files-found: warn
