name: ORBIUNO | Actualizacion resumen inicial y fotos del visor
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/orbiuno-actualizacion-visor-20261114.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: orbiuno-actualizacion-visor-20261114
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar voz, fotos archivadas y editor de video
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install 'kokoro-onnx==0.6.1' Pillow numpy soundfile
          curl --fail --location --retry 3 https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx -o /tmp/kokoro-v1.0.onnx
          curl --fail --location --retry 3 https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin -o /tmp/voices-v1.0.bin
          echo '7d5df8ecf7d4b1878015a32686053fd0eebe2bc377234608764cc0ef3636a6c5  /tmp/kokoro-v1.0.onnx' | sha256sum --check
          echo 'bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d  /tmp/voices-v1.0.bin' | sha256sum --check
      - name: Generar nuevo Reel con resumen inicial
        run: |
          python scripts/orbiuno_actualizacion_resumen_visor.py
      - name: Verificar video, resumen y seis fotos reales del visor
        run: |
          python - <<'PY'
          import json,subprocess,hashlib
          from pathlib import Path
          root=Path('media/2026-11-14-orbiuno-actualizacion')
          manifest=json.loads((root/'edicion-manifiesto.json').read_text())
          path=root/'ORBIUNO-2026-11-14_ACTUALIZADO_RESUMEN_VISOR.mp4'
          assert manifest['status']=='VIDEO_READY_NOT_PUBLISHED'
          assert len(manifest['credits'])==6
          assert manifest['sha256']==hashlib.sha256(path.read_bytes()).hexdigest()
          assert all((Path('media/2026-11-14-publicable')/('orbiuno-%02d.jpg'%i)).exists() for i in range(1,7))
          info=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_streams','-show_format','-of','json',str(path)]))
          assert any(s['codec_type']=='audio' for s in info['streams'])
          assert any(s['codec_type']=='video' and s.get('width')==720 and s.get('height')==1280 for s in info['streams'])
          assert 55<float(info['format']['duration'])<120
          print('REEL_UPDATED_VALIDATED',manifest['duration_seconds'],manifest['time_of_production_bogota'],flush=True)
          PY
      - name: Guardar actualizacion sin alterar ni borrar el Reel anterior
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add media/2026-11-14-orbiuno-actualizacion
          git commit -m 'ORBIUNO: nueva portada resumen de seis noticias con hora y fotos reales [skip ci]'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ORBIUNO-14NOV-RESUMEN-VISOR
          path: |
            media/2026-11-14-orbiuno-actualizacion/*.mp4
            media/2026-11-14-orbiuno-actualizacion/*.json
            media/2026-11-14-orbiuno-actualizacion/*.jpg
          retention-days: 30
          if-no-files-found: ignore
