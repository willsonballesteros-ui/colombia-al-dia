name: ORBIUNO 19h Gonzalo - producir sin publicar
on:
  push:
    branches: [main]
    paths: ['.github/workflows/orbiuno-gonzalo-1900.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  produce:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencias gratuitas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install edge-tts
      - name: Narrar con Gonzalo y generar MP4
        run: python scripts/orbiuno_gonzalo_1900.py
      - name: Guardar resultado sin sobrescribir original
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add media/2026-11-15/ORBIUNO_2026-11-15_1900_GONZALO_FINAL.mp4 media/2026-11-15/orbiuno_1900_gonzalo_manifest.json
          git commit -m 'ORBIUNO: seis noticias con Gonzalo (pendiente escucha)'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Guardar artefactos para inspeccion
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ORBIUNO-GONZALO-1900
          path: |
            media/2026-11-15/ORBIUNO_2026-11-15_1900_GONZALO_FINAL.mp4
            media/2026-11-15/orbiuno_1900_gonzalo_manifest.json
          if-no-files-found: warn
