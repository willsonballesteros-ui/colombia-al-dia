name: ORBIUNO y MyCar | Publicación edición 17 noviembre 18h
on:
  push:
    branches: [feat/pm-17nov-orbiuno-mycar-publicar]
    paths:
      - 'scripts/render_17nov_pm.py'
      - 'scripts/build_web_17nov_pm.py'
      - 'editions/preview_media_2026-11-17-pm.json'
      - '.github/workflows/reels-17nov-1800.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  producir-previas:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar FFmpeg y dependencias sin Kokoro
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install pillow requests edge-tts
      - name: Verificar que no se altere producción
        run: |
          python -m json.tool editions/preview_media_2026-11-17-pm.json >/dev/null
          ffprobe -version | head -1
          test "$GITHUB_EVENT_NAME" = "push" || test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
      - name: Producir dos MP4 con fotos CC y narración Salomé
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python scripts/render_17nov_pm.py
      - name: Preparar una página web que refleje las 6 noticias
        run: python scripts/build_web_17nov_pm.py

      - name: Verificar MP4, fuentes, imágenes y web
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          out=Path("build/pm_17nov")
          for brand,num in (("ORBIUNO",6),("MYCAR",4)):
              video=out/(brand+"_17_NOV_2026_1800_REEL_PREVIA.mp4")
              assert video.stat().st_size>500000, "Video faltante: "+brand
              report=json.loads((out/brand.lower()/"audio"/"audio_report.json").read_text())
              assert report["status"]=="ok" and len(report["segments"])==num+2
              credits=json.loads((out/brand.lower()/"credits.json").read_text())
              assert len(credits)==num and all(x["license"] and x["author"] and x["commons"] for x in credits)
              meta=json.loads(subprocess.check_output(["ffprobe","-v","error","-show_streams","-show_format","-of","json",str(video)]))
              assert float(meta["format"]["duration"])>25
              assert any(x.get("codec_name")=="h264" and x.get("width")==1080 and x.get("height")==1920 for x in meta["streams"])
              assert any(x.get("codec_name")=="aac" for x in meta["streams"])
              print("READY_FOR_HOSTING",brand,meta["format"]["duration"],video.stat().st_size)
          assert (out/"edicion-2026-11-17-1800.html").stat().st_size>3000
          PY

      - name: Alojar MP4 y web en main después de QA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git worktree add -B publicar-17nov-1800 "$RUNNER_TEMP/orbiuno-public" origin/main
          cd "$RUNNER_TEMP/orbiuno-public"
          test ! -e media/2026-11-17/orbiuno-pm/ORBIUNO_17_NOV_2026_1800_REEL_PUBLICAR.mp4 || { echo 'Edition already hosted; no overwrite'; exit 1; }
          mkdir -p media/2026-11-17/orbiuno-pm/audio media/2026-11-17/mycar-pm
          cp "$GITHUB_WORKSPACE/build/pm_17nov/ORBIUNO_17_NOV_2026_1800_REEL_PREVIA.mp4" media/2026-11-17/orbiuno-pm/ORBIUNO_17_NOV_2026_1800_REEL_PUBLICAR.mp4
          cp "$GITHUB_WORKSPACE/build/pm_17nov/MYCAR_17_NOV_2026_1800_REEL_PREVIA.mp4" media/2026-11-17/mycar-pm/MYCAR_17_NOV_2026_1800_REEL_PUBLICAR.mp4
          cp "$GITHUB_WORKSPACE/build/pm_17nov/orbiuno/"*.jpg media/2026-11-17/orbiuno-pm/
          cp "$GITHUB_WORKSPACE/build/pm_17nov/orbiuno/"*.png media/2026-11-17/orbiuno-pm/ 2>/dev/null || true
          cp "$GITHUB_WORKSPACE/build/pm_17nov/orbiuno/audio/"*.mp3 media/2026-11-17/orbiuno-pm/audio/
          cp "$GITHUB_WORKSPACE/build/pm_17nov/orbiuno/credits.json" media/2026-11-17/orbiuno-pm/
          cp "$GITHUB_WORKSPACE/build/pm_17nov/mycar/credits.json" media/2026-11-17/mycar-pm/
          cp "$GITHUB_WORKSPACE/build/pm_17nov/edicion-2026-11-17-1800.html" edicion-2026-11-17-1800.html
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path("index.html")
          t=p.read_text(encoding="utf-8")
          phrase='edicion-2026-11-17-1800.html'
          if phrase not in t:
              banner='<div role="region" aria-label="Edición de hoy" style="background:#12374c;color:white;text-align:center;padding:12px;font:700 17px system-ui"><a href="/edicion-2026-11-17-1800.html" style="color:#81f3e8">▶ EDICIÓN DEL 17 NOV · 6:00 P. M. · SEIS NOTICIAS Y SUS AUDIOS</a></div>'
              t,n=re.subn(r'(<body\b[^>]*>)',lambda m:m.group(1)+banner,t,count=1,flags=re.I)
              if n!=1:raise SystemExit("BLOCKED: cuerpo HTML no encontrado")
              p.write_text(t,encoding="utf-8")
          PY
          git add media/2026-11-17 edicion-2026-11-17-1800.html index.html
          git diff --cached --quiet && { echo 'Nothing to upload'; exit 1; }
          git commit -m 'ORBIUNO y MyCar: videos del 17 nov y web con seis audios'
          git push origin HEAD:main

      - name: Guardar ambos MP4, créditos, audio, subtítulos editoriales y fuentes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PREVIAS-ORBIUNO-MYCAR-17NOV
          path: build/pm_17nov/
          if-no-files-found: warn
          retention-days: 30
