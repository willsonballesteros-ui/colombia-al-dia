name: ORBIUNO - Validacion medios 18h
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-media-18h.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar original de MP4 y teaser PNG
        run: |
          test -s media/2026-11-06/reel_18pm.mp4
          test -s media/2026-11-06/historia_18pm.png
          ffprobe -v error -show_entries format=duration,size:stream=codec_type,codec_name,width,height -of json media/2026-11-06/reel_18pm.mp4
      - name: Extraer 4 fotogramas para revisión humana
        run: |
          for t in 3 12 29 49; do
            ffmpeg -hide_banner -loglevel error -y -ss "$t" -i media/2026-11-06/reel_18pm.mp4 -frames:v 1 "media/2026-11-06/reel_18pm_preview_$t.png"
          done
      - name: Guardar capturas en el repositorio
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add media/2026-11-06/reel_18pm_preview_*.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'ORBIUNO: fotogramas de auditoria del Reel 18h'
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && break
            sleep "$((i*3))"
          done
      - name: Probar MIME correcto y estado HTTP de activos en Cloudflare
        run: |
          for TYPE in reel_18pm.mp4 historia_18pm.png; do
            URL="https://colombia-al-dia.pages.dev/media/2026-11-06/$TYPE"
            echo "Revisando $URL"
            curl -sSLI --retry 4 --retry-delay 3 "$URL" -o /tmp/headers
            cat /tmp/headers
            if [[ "$TYPE" == *.mp4 ]]; then
              grep -iq 'content-type: video/mp4' /tmp/headers || { echo "VIDEO_PUBLICO_NO_VALIDADO"; exit 1; }
            else
              grep -iq 'content-type: image/png' /tmp/headers || { echo "HISTORIA_PUBLICA_NO_VALIDADA"; exit 1; }
            fi
          done
          echo "ACTIVOS_PUBLICOS_VALIDOS"
