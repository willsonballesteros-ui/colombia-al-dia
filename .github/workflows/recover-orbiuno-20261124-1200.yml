name: "ORBIUNO | Recuperar edición 24NOV mediodía"
on:
  push:
    branches: [main]
    paths: ['.github/workflows/recover-orbiuno-20261124-1200.yml', 'editions/research/orbiuno-2026-11-24-1200-ready.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: orbiuno-six-daily-serial
  cancel-in-progress: false
jobs:
  producir:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        brand: [orbiuno]
    env:
      NEWS_BRAND: ${{ matrix.brand }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias y validar sintaxis
        run: |
          python -m pip install -q Pillow requests edge-tts
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; fi
          python -m py_compile tools/editorial/produce_20261124_1200.py tools/editorial/sync_orbiuno_20261124_1200.py
      - name: Producción y auditoría de la edición
        run: |
          PYTHONPATH=. python tools/editorial/produce_20261124_1200.py
          python - <<'PY'
          import json,os,hashlib,subprocess
          from pathlib import Path
          b=os.environ["NEWS_BRAND"]; p=Path("media/2026-11-24/edicion-1200-"+b)
          m=json.loads((p/(b+"_manifest.json")).read_text())
          count=6 if b=="orbiuno" else 5
          assert m["newsCount"]==m["imagesCount"]==m["logosCount"]==m["fullNewsAudioFiles"]==count
          assert m["voice"]=="es-CO-SalomeNeural" and m["voiceSpeed"]==1.25
          assert all(x["rightsVerified"] for x in m["photoCredits"])
          assert hashlib.sha256((p/m["video"]).read_bytes()).hexdigest()==m["sha256"]
          for i in range(1,count+1):
              assert (p/f"{b}-noticia-{i:02d}.mp3").stat().st_size>1000
          subprocess.run(["ffmpeg","-v","error","-i",str(p/m["video"]),"-f","null","-"],check=True)
          print("MEDIA_QA_PASS",b,m["duration"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: news-20261124-1200-${{ matrix.brand }}
          path: media/2026-11-24/edicion-1200-${{ matrix.brand }}/
          if-no-files-found: error
  sincronizar:
    needs: producir
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: news-20261124-1200-orbiuno
          path: media/2026-11-24/edicion-1200-orbiuno
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Sincronizar exclusivamente ORBIUNO sin tocar el feed MyCar
        run: |
          set -euo pipefail
          python -m pip install -q Pillow
          PYTHONPATH=. python tools/editorial/sync_orbiuno_20261124_1200.py
          python scripts/build_feed.py
          src=media/2026-11-24/edicion-1200-orbiuno
          mkdir -p "site/$src" site/media/web-voice
          cp -a "$src/." "site/$src/"
          cp orbiuno-2026-11-24-1200.html noticias.json index.html feed.xml site/
          cp media/web-voice/manifest.json site/media/web-voice/manifest.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$src" "site/$src" media/web-voice/manifest.json site/media/web-voice/manifest.json noticias.json index.html feed.xml site/noticias.json site/index.html site/feed.xml orbiuno-2026-11-24-1200.html site/orbiuno-2026-11-24-1200.html
          git commit -m 'ORBIUNO: edición internacional 24NOV 12h'
          git push origin HEAD:main
      - name: Comprobar ORBIUNO web y publicar una sola vez por API Meta
        env:
          ORBIUNO_IG_USER_ID: ${{ secrets.ORBIUNO_IG_USER_ID }}
          ORBIUNO_IG_ACCESS_TOKEN: ${{ secrets.ORBIUNO_IG_ACCESS_TOKEN }}
        run: |
          python - <<'PY'
          import hashlib,json,subprocess,time
          from urllib.request import urlopen
          from pathlib import Path
          p=Path("media/2026-11-24/edicion-1200-orbiuno")
          m=json.loads((p/"orbiuno_manifest.json").read_text())
          root="https://colombia-al-dia.pages.dev/"
          base=root+str(p)+"/"
          for attempt in range(10):
              try:
                  with urlopen(root+"orbiuno-2026-11-24-1200.html",timeout=20) as r: assert r.status==200
                  with urlopen(base+m["video"],timeout=40) as r: assert hashlib.sha256(r.read()).hexdigest()==m["sha256"]
                  for i in range(1,7):
                      for f in (f"orbiuno-noticia-{i:02d}.mp3",f"foto-orbiuno-{i:02d}.jpg",f"orbiuno-logo-{i:02d}.png"):
                          with urlopen(base+f,timeout=20) as r: assert r.status==200 and len(r.read(1024))>100
                  break
              except Exception:
                  if attempt==9: raise
                  time.sleep(15)
          cap=(p/"orbiuno_caption.txt").read_text().replace("[ORBIUNO-2026-11-24-1200]","").strip()
          subprocess.run(["python","scripts/publish_meta_direct.py","--video-url",base+m["video"],"--caption",cap,"--edition-key","ORBIUNO-2026-11-24-1200","--publish"],check=True)
          PY
