name: ORBIUNO corregir etiquetas de fecha obsoletas
on:
  push:
    branches: [main]
    paths: ['.github/workflows/corregir-fecha-portada.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  corregir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corregir etiquetas sin falsificar fechas
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          cambios={
            'Noticias de hoy':'Últimas noticias publicadas',
            'Edición completa de hoy':'Última edición disponible',
          }
          for a,b in cambios.items():
              print(a, s.count(a))
              s=s.replace(a,b)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Guardar corrección en main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then echo 'No hay cambios'; exit 0; fi
          git commit -m 'ORBIUNO: no presentar noticias anteriores como de hoy'
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 3
          done
          exit 1
