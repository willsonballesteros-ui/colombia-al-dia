name: ORBIUNO · Reel 11 noviembre 22:00
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/orbiuno-2026-11-11-2200.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar FFmpeg y herramientas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install kokoro-onnx==0.6.1 numpy Pillow soundfile onnxruntime
          python -m py_compile scripts/orbiuno_2026_11_11_2200.py
      - name: Descargar voz ef_dora y verificar integridad
        run: |
          curl --fail -L --retry 3 https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx -o /tmp/kokoro-v1.0.onnx
          curl --fail -L --retry 3 https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin -o /tmp/voices-v1.0.bin
          echo '7d5df8ecf7d4b1878015a32686053fd0eebe2bc377234608764cc0ef3636a6c5  /tmp/kokoro-v1.0.onnx' | sha256sum -c
          echo 'bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d  /tmp/voices-v1.0.bin' | sha256sum -c
      - name: Crear MP4 nocturno con audio
        run: python scripts/orbiuno_2026_11_11_2200.py
      - name: Comprobar que no se simuló un render
        run: |
          test -s dist/orbiuno-2026-11-11-2200/ORBIUNO_2026-11-11_2200.mp4
          test -s dist/orbiuno-2026-11-11-2200/fuentes.json
          ffprobe -v error -show_entries format=duration:stream=codec_type,width,height -of json dist/orbiuno-2026-11-11-2200/ORBIUNO_2026-11-11_2200.mp4
      - name: Adjuntar video, fuentes y caption para publicación manual
        uses: actions/upload-artifact@v4
        with:
          name: ORBIUNO-2026-11-11-2200-NOCHE
          path: dist/orbiuno-2026-11-11-2200/
          if-no-files-found: error
          retention-days: 30
