name: ORBIUNO - Historia teaser 18h
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/story-18h.yml'
      - 'scripts/render_orbiuno_historia_18h.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: orbiuno-story-18h-20261106
  cancel-in-progress: false
jobs:
  story:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - run: |
          curl --fail --location --retry 3 https://colombia-al-dia.pages.dev/edicion-2026-11-06-18.html -o /tmp/edicion.html
          grep -Fq "Contraloría pide explicaciones por fallas en radares de El Dorado" /tmp/edicion.html
      - run: python scripts/render_orbiuno_historia_18h.py
      - name: Guardar solo el teaser de Historia validado
        run: |
          F=media/2026-11-06/historia_18pm.png
          test "$(stat -c%s "$F")" -gt 30000
          file "$F"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$F"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'ORBIUNO: Historia teaser edición 18:00'
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep "$((i*3))"
          done
          exit 1
