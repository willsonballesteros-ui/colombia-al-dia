name: ORBIUNO | Publicar edición web verificada
on:
  workflow_run:
    workflows: ['ORBIUNO | Verificar web y MP4 existente']
    types: [completed]
  workflow_dispatch:
    inputs:
      slot:
        description: 'Franja Colombia (0800 o 1800)'
        type: choice
        options: ['0800', '1800']
        required: true
  schedule:
    - cron: '0,15,30,45 13,14,23,0 * * *'
permissions:
  contents: write
concurrency:
  group: orbiuno-meta-publicacion-serial
  cancel-in-progress: false
jobs:
  publicar:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      REQUESTED_SLOT: ${{ inputs.slot }}
      ORBIUNO_IG_ACCESS_TOKEN: ${{ secrets.ORBIUNO_IG_ACCESS_TOKEN }}
      ORBIUNO_IG_USER_ID: ${{ secrets.ORBIUNO_IG_USER_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Confirmar web y publicar sin duplicados
        shell: bash
        run: |
          set -euo pipefail
          day=$(TZ=America/Bogota date +%F)
          hour=$(TZ=America/Bogota date +%H)
          slot="${REQUESTED_SLOT:-0800}"
          case "$hour" in
            08|09) current=0800 ;;
            18|19) current=1800 ;;
            *) echo 'Fuera de la ventana de publicación'; exit 1 ;;
          esac
          slot="${REQUESTED_SLOT:-$current}"
          test "$slot" = "$current"
          test -s "media/$day/edicion-$slot-orbiuno/orbiuno_manifest.json"
          ledger="editions/publication-ledger/$day-$slot.json"
          python scripts/verify_public_edition.py --day "$day" --slot "$slot"
          if [ -s "$ledger" ] && python - "$ledger" <<'PY'
          import json, re, sys
          from pathlib import Path
          receipt = json.loads(Path(sys.argv[1]).read_text()).get('orbiuno', {})
          checked = json.loads(Path('/tmp/orbiuno-preflight.json').read_text())
          valid = (receipt.get('state') == 'published'
                   and receipt.get('sha256') == checked['sha256']
                   and str(receipt.get('id', '')).isdigit()
                   and re.fullmatch(r'https://www\.instagram\.com/(reel|p)/[\w-]+/', receipt.get('permalink', '')))
          sys.exit(0 if valid else 1)
          PY
          then echo 'Publicación ya confirmada con ID, enlace y SHA de la edición'; exit 0; fi
          folder="media/$day/edicion-$slot-orbiuno"
          video="$(python -c 'import json; print(json.load(open("/tmp/orbiuno-preflight.json"))["video_url"])')"
          caption="$(grep -vFx "[ORBIUNO-$day-$slot]" "$folder/orbiuno_caption.txt")"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python scripts/publish_meta_direct.py --video-url "$video" --caption "$caption" --edition-key "ORBIUNO-$day-$slot" > /tmp/orbiuno-dry.json
          if grep -q 'ALREADY_PUBLISHED' /tmp/orbiuno-dry.json; then
            cp /tmp/orbiuno-dry.json /tmp/orbiuno-meta.json
          else
            mkdir -p "$(dirname "$ledger")"
            python - "$ledger" "$day-$slot" <<'PY'
          import json,sys,os
          from pathlib import Path
          p=Path(sys.argv[1]); d=json.loads(p.read_text()) if p.exists() else {'edition':sys.argv[2]}
          assert d.get('orbiuno',{}).get('state') not in ('published','publishing')
          d['orbiuno']={'state':'publishing','edition_key':'ORBIUNO-'+sys.argv[2],'run':os.environ['GITHUB_RUN_ID']}
          p.write_text(json.dumps(d,indent=2)+'\n')
          PY
            git add "$ledger"
            git commit -m "ORBIUNO: reservar envío $day $slot"
            git push origin HEAD:main
            python scripts/publish_meta_direct.py --video-url "$video" --caption "$caption" --edition-key "ORBIUNO-$day-$slot" --publish | tee /tmp/orbiuno-meta.json
          fi
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python - "$ledger" <<'PY'
          import json,sys,os
          from pathlib import Path
          from datetime import datetime,timezone
          p=Path(sys.argv[1]); p.parent.mkdir(parents=True,exist_ok=True); d=json.loads(p.read_text()) if p.exists() else {'edition':p.stem}
          r=json.loads(Path('/tmp/orbiuno-meta.json').read_text().splitlines()[-1])
          v=json.loads(Path('/tmp/orbiuno-preflight.json').read_text())
          assert r['state'] in ('PUBLISHED','ALREADY_PUBLISHED')
          assert str(r.get('id','')).isdigit() and r.get('url','').startswith('https://www.instagram.com/')
          old=d.get('orbiuno',{})
          if old.get('state')=='published':
              assert old.get('id')==r['id']
          else:
              d['orbiuno']={'state':'published','id':r['id'],'url':r['url'],'permalink':r['url'],'confirmed_at':datetime.now(timezone.utc).isoformat(),'sha256':v['sha256'],'publisher_run':int(os.environ['GITHUB_RUN_ID'])}
              p.write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\n')
          PY
            mkdir -p "$(dirname "$ledger")"
            git add "$ledger"
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "ORBIUNO: registrar publicación Meta $day $slot"
            if git push origin HEAD:main; then exit 0; fi
            sleep "$attempt"
          done
          exit 1
