name: ORBIUNO - Reel 18h con presentación de la hora
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reel-18h-intro.yml'
permissions:
  contents: write
concurrency:
  group: orbiuno-18h-introduccion
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar librerías y FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install --disable-pip-version-check "kokoro-onnx==0.6.1" numpy Pillow soundfile
      - name: Preparar voz oficial
        run: |
          curl -fL --retry 3 https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx -o /tmp/kokoro-v1.0.onnx
          curl -fL --retry 3 https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin -o /tmp/voices-v1.0.bin
          echo '7d5df8ecf7d4b1878015a32686053fd0eebe2bc377234608764cc0ef3636a6c5  /tmp/kokoro-v1.0.onnx' | sha256sum --check
          echo 'bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d  /tmp/voices-v1.0.bin' | sha256sum --check
      - name: Generar versión con introducción hablada
        run: python scripts/insert_intro_18h.py
      - name: Guardar versión nueva sin duplicar Instagram
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add media/2026-11-06/reel_18pm_con_intro.mp4 media/2026-11-06/reel_18pm_con_intro.json
          git commit -m 'ORBIUNO: agregar hora hablada al comienzo de Reel 18h'
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 3
          done
          exit 1
