name: Generar carrusel e historia ORBIUNO
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'noticias.json'
      - 'scripts/build_carousel.py'
      - '.github/workflows/generar-carrusel.yml'

permissions:
  contents: write

concurrency:
  group: carrusel-imagenes
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar Pillow
        run: python -m pip install --disable-pip-version-check pillow==12.0.0
      - name: Verificar noticias
        run: python scripts/validate_news.py noticias.json
      - name: Renderizar diez láminas
        run: python scripts/build_carousel.py
      - name: Verificar cantidad y dimensiones
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          date=json.loads(Path('noticias.json').read_text())['editionDate']
          images=list((Path('media')/date).glob('top10-*.png'))
          assert len(images)==10, len(images)
          for file in images:
              with Image.open(file) as image: assert image.size==(1080,1350),file
          visuals=list((Path('media')/date).glob('visual-*.png'))
          assert len(visuals)==10, 'Se requieren 10 ilustraciones originales'
          for file in visuals:
              with Image.open(file) as art: assert art.size==(1080,600),file
          story=Path('media')/date/'historia-orbiuno.png'
          assert story.exists(), 'No se generó historia'
          with Image.open(story) as cover: assert cover.size==(1080,1920),story
          print('Validado:',len(images),'láminas + historia ORBIUNO')
          PY
      - name: Publicar imágenes sobre la última versión de main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for i in 1 2 3; do
            # Rehacer imágenes desde la rama actual para evitar conflictos de rebase.
            git fetch origin main
            git reset --hard origin/main
            python scripts/validate_news.py noticias.json
            python scripts/build_carousel.py
            git add media
            if git diff --cached --quiet; then
              echo 'Imágenes ya sincronizadas'; exit 0
            fi
            git commit -m 'ORBIUNO: renovar ilustraciones y carrusel editorial'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((i * 3))
          done
          echo 'No se pudo guardar material gráfico sin conflicto' >&2
          exit 1
