name: ORBIUNO - Carrusel bajo demanda (solo generar, sin publicar)
on:
  workflow_dispatch:
    inputs:
      edition_slot:
        description: 'Franja editorial: 8am, 12m, 6pm'
        required: true
        type: choice
        options:
          - 8am
          - 12m
          - 6pm
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ORBIUNO_EDITION_SLOT: ${{ inputs.edition_slot }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow==12.0.0
      - name: Preparar metadatos y validar noticias
        run: |
          python scripts/prepare_audio.py noticias.json
          python scripts/validate_news.py noticias.json
      - name: Generar imágenes de la franja solicitada
        run: |
          python scripts/build_carousel.py
          python scripts/build_caption.py
      - name: Guardar artefactos para revisión; no publicar ni borrar archivos
        uses: actions/upload-artifact@v4
        with:
          name: orbiuno-carrusel-${{ inputs.edition_slot }}
          path: |
            media/*/portada.png
            media/*/grupo-*.png
            media/*/historia-orbiuno.png
            media/*/instagram-compacto.json
            media/*/instagram-publicacion.json
            media/*/instagram-caption.txt
          if-no-files-found: error
