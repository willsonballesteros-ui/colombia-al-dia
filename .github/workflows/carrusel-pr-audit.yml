name: ORBIUNO - Verify exact PR commit and safety tests
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact code revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA" || exit 1
          echo "Verified immutable commit: $ACTUAL_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "No publishing permissions." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tests
        run: python -m pip install "jsonschema>=4.20,<5" "Pillow>=10,<12"
      - name: Verify FFmpeg tools installed
        run: |
          ffmpeg -version
          ffprobe -version
      - name: Execute fail-closed regressions
        run: |
          python -m py_compile scripts/preflight_carousel.py tests/test_preflight_carousel.py
          python -m unittest discover -s tests -p 'test_preflight_carousel.py' -v
      - name: Remain blocked
        if: always()
        run: echo "Production blocked until license review, public web tests, real iPhone audio and Meta gating." >> "$GITHUB_STEP_SUMMARY"
