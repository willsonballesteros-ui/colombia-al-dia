name: ORBIUNO - Corregir rotulo video 18h
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-reel-18h.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Instalar FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Corregir rotulo de la categoría larga sin tocar la voz
        run: |
          set -eux
          F=media/2026-11-06/reel_18pm.mp4
          test -s "$F"
          ffmpeg -hide_banner -loglevel error -nostdin -y -i "$F" \
            -vf "drawbox=x=154:y=625:w=590:h=48:color=0x09252C:t=fill:enable='between(t,27.2,49.8)',drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='ENTRETENIMIENTO Y FARÁNDULA':fontcolor=white:fontsize=22:x=164:y=630:enable='between(t,27.2,49.8)'" \
            -c:v libx264 -preset veryfast -crf 23 -pix_fmt yuv420p -c:a copy -movflags +faststart /tmp/reel_corregido.mp4
          ffprobe -v error -show_entries format=duration,size:stream=codec_type,width,height -of json /tmp/reel_corregido.mp4
          mv /tmp/reel_corregido.mp4 "$F"
          ffmpeg -hide_banner -loglevel error -nostdin -y -ss 29 -i "$F" -frames:v 1 media/2026-11-06/reel_18pm_preview_29.png
      - name: Guardar corrección sin duplicar ninguna publicación
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add media/2026-11-06/reel_18pm.mp4 media/2026-11-06/reel_18pm_preview_29.png
          git commit -m 'ORBIUNO: rótulo Entretenimiento y Farándula completo'
          git pull --rebase origin main
          git push origin HEAD:main
