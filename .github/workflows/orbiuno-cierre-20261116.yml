name: ORBIUNO | Cierre verificado 16 noviembre 2026 | producir sin publicar
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/orbiuno-cierre-20261116.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: orbiuno-20261116-1900-produce-only
  cancel-in-progress: false
jobs:
  producir:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - name: Leer base original
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Incorporar solo las seis noticias del día, sin borrar histórico
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          path=Path('noticias.json')
          data=json.loads(path.read_text(encoding='utf-8'))
          edition=json.loads(Path('editions/2026-11-16-1900.json').read_text(encoding='utf-8'))
          assert edition['editionDate']=='2026-11-16'
          assert edition['editionSlot']=='19:00'
          assert len(edition['news'])==6
          assert len({x['id'] for x in edition['news']})==6
          assert all(x['verification']=='editorial_verified' and x['originalArticleReviewed'] is True for x in edition['news'])
          existing={x['id']:x for x in data['news']}
          for n in edition['news']:
            if n['id'] in existing and existing[n['id']]!=n:
              raise RuntimeError('ID existente con contenido distinto: '+n['id'])
          data['news'] += [n for n in edition['news'] if n['id'] not in existing]
          data['editionDate']=edition['editionDate']
          path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('IMPORT_OK',len(data['news']), 'archivadas + nuevas')
          PY
          python scripts/validate_news.py noticias.json
          python -m py_compile scripts/render_orbiuno_6_noticias.py scripts/generate_web_voice.py scripts/prepare_site.py
      - name: Instalar herramientas de producción
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install kokoro-onnx==0.6.1 numpy Pillow soundfile onnxruntime
      - name: Descargar y validar voz Dora
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx -o /tmp/kokoro-v1.0.onnx
          curl --fail --location --retry 3 https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin -o /tmp/voices-v1.0.bin
          echo '7d5df8ecf7d4b1878015a32686053fd0eebe2bc377234608764cc0ef3636a6c5  /tmp/kokoro-v1.0.onnx' | sha256sum --check
          echo 'bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d  /tmp/voices-v1.0.bin' | sha256sum --check
      - name: Voz íntegra web e interfaz sincronizada
        run: |
          python scripts/generate_web_voice.py
          python scripts/prepare_site.py
      - name: Renderizar Reel real con voz española 1.25x
        env:
          ORBIUNO_EDITION_DATE: '2026-11-16'
          ORBIUNO_EDITION_SLOT: '19:00'
        run: python scripts/render_orbiuno_6_noticias.py
      - name: Validar seis noticias y MP4 H264 AAC
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,hashlib,pathlib,subprocess
          out=pathlib.Path('dist/orbiuno-2026-11-16-1900')
          m=json.loads((out/'manifest.json').read_text(encoding='utf-8'))
          assert m['edition']=='2026-11-16' and m['slot']=='19:00'
          assert m['newsCount']==6 and len(set(m['newsIds']))==6
          assert 50 <= m['duration'] <=60 and m['voice']=='ef_dora' and m['voiceSpeed']==1.25
          p=out/m['video']
          assert p.is_file() and p.stat().st_size>100000
          assert hashlib.sha256(p.read_bytes()).hexdigest()==m['sha256']
          ff=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration:stream=codec_type,codec_name,width,height','-of','json',str(p)]))
          assert any(s.get('codec_name')=='h264' and s.get('width')==1080 and s.get('height')==1920 for s in ff['streams'])
          assert any(s.get('codec_name')=='aac' for s in ff['streams'])
          db=json.loads(pathlib.Path('noticias.json').read_text(encoding='utf-8'))
          actual=[x['id'] for x in sorted((x for x in db['news'] if x.get('date')=='2026-11-16' and x.get('editionSlot')=='19:00' and x.get('verification')=='editorial_verified'),key=lambda x:x.get('priority',999))]
          assert actual==m['newsIds']
          print('MP4_VALIDATED',p,m['duration'],m['sha256'])
          PY
      - name: Guardar medios y web en main sin sobrescribir ediciones previas
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p media/2026-11-16
          cp dist/orbiuno-2026-11-16-1900/*.mp4 media/2026-11-16/
          cp dist/orbiuno-2026-11-16-1900/manifest.json media/2026-11-16/orbiuno_6_noticias_manifest.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add noticias.json index.html media/web-voice media/2026-11-16
          if ! git diff --cached --quiet; then
            git commit -m 'ORBIUNO web y MP4 final seis noticias 2026-11-16'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
      - name: Preflight Cloudflare y seis MP3 antes de Instagram
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re,time,urllib.request
          from pathlib import Path
          homepage='https://colombia-al-dia.pages.dev/'
          m=json.loads(Path('media/2026-11-16/orbiuno_6_noticias_manifest.json').read_text(encoding='utf-8'))
          def read(url,limit=12000000):
            q=urllib.request.Request(url,headers={'User-Agent':'ORBIUNO-QA/1.0','Cache-Control':'no-cache'})
            with urllib.request.urlopen(q,timeout=25) as x:return x.read(limit)
          for i in range(16):
            try:
              page=read(homepage).decode('utf-8')
              match=re.search(r'<script[^>]*id="initial-news"[^>]*>(.*?)</script>',page,re.S)
              if not match:raise RuntimeError('No hay noticias incrustadas')
              obj=json.loads(match.group(1))
              n=sorted([x for x in obj['news'] if x.get('date')=='2026-11-16' and x.get('editionSlot')=='19:00' and x.get('verification')=='editorial_verified'],key=lambda x:x.get('priority',999))
              if obj['editionDate']!='2026-11-16' or [x['id'] for x in n]!=m['newsIds']:raise RuntimeError('Web aun sin la edicion completa')
              voice=json.loads(read(homepage+'media/web-voice/manifest.json').decode('utf-8'))
              for x in n:
                item=voice.get('items',{}).get(x['id'])
                if not item or not item.get('text') or not item.get('url'):raise RuntimeError('MP3 no generado para '+x['id'])
                if not read(homepage+item['url'].removeprefix('./'),limit=128):raise RuntimeError('MP3 inaccesible')
              url='https://raw.githubusercontent.com/willsonballesteros-ui/colombia-al-dia/main/media/2026-11-16/'+m['video']
              assert read(url,limit=1024)
              print('PREFLIGHT_PASS',url)
              break
            except Exception as exc:
              print('PREFLIGHT_RETRY',i,str(exc)[:250],flush=True)
              if i==15:raise
              time.sleep(20)
          PY
      - name: Conservar manifiesto y MP4 para QA incluso si falla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbiuno-2026-11-16-1900-seis-noticias
          path: dist/orbiuno-2026-11-16-1900/
          if-no-files-found: warn
          retention-days: 30
