name: Distribuir video validado MyCar 21nov a web
on:
  push:
    branches: [main]
    paths: ['.github/workflows/distribuir-mycar-20261121.yml']
permissions:
  contents: write
jobs:
  publicar-video-web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Copiar MP4 validado desde artefacto GitHub, sin cambiar V21
        shell: bash
        env:
          ARCHIVE_URL: 'https://sdmntpreastus3.oaiusercontent.com/files/00000000-45cc-8212-adb1-4a75ff904c13/raw?se=2026-11-21T13%3A33%3A36Z&sp=r&sv=2026-06-06&sr=b&scid=51fd5bc4-29b0-58ee-8870-fa572044b657&skoid=434ec24f-a0f0-4e64-b0de-2e2053f69735&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-21T05%3A03%3A35Z&ske=2026-11-22T05%3A03%3A35Z&sks=b&skv=2026-06-06&sig=Q8l/6KVl%2BjBrqbBrOFyDakItokHA75o%2Bo9dOO5EiaaU%3D'
        run: |
          set -euo pipefail
          mkdir -p media/2026-11-21 /tmp/mycar-assets
          curl --fail --location --retry 1 --max-time 90 --silent --show-error "$ARCHIVE_URL" -o /tmp/mycar-assets/edition.zip
          unzip -o /tmp/mycar-assets/edition.zip 'MYCAR_AL_DIA_2026-11-21.mp4' 'report.json' 'publish_ready.json' -d /tmp/mycar-assets >/dev/null
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('/tmp/mycar-assets')
          r=json.loads((root/'report.json').read_text())
          p=json.loads((root/'publish_ready.json').read_text())
          video=root/'MYCAR_AL_DIA_2026-11-21.mp4'
          assert r['production_valid'] is True and r['voice']['voice']=='es-CO-SalomeNeural' and r['voice']['speed']==1.25
          assert p['sha256']==r['sha256']==hashlib.sha256(video.read_bytes()).hexdigest()
          assert video.stat().st_size>1000000
          pathlib.Path('media/2026-11-21/MYCAR_21NOV2026_0800_V8.mp4').write_bytes(video.read_bytes())
          print('MYCAR_VIDEO_SHA_OK',r['sha256'])
          PY
      - name: Publicar MP4 sin duplicados
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add media/2026-11-21/MYCAR_21NOV2026_0800_V8.mp4
          if git diff --cached --quiet; then echo 'VIDEO_YA_EN_REPO'; exit 0; fi
          git commit -m 'MyCar 21nov 08:00 media validado V8 5 noticias [skip ci]'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
